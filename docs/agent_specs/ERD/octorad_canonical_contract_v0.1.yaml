# octorad canonical data contract — normalized/computed 표준 SPEC
# v0.1 (2026-06-14). 오너 confirm: 영문 snake_case · 정규화값+lineage · 파생 computed 재계산 · MER · member/anon·grade/tier 분리.
# 이 SPEC = 채널별 translator + conversion 규칙의 단일 권위. normalized ERD/metadata/desc·lineage를 여기서 생성.
# 입력: normalize_canonical_naming_v0.1 · referrence/06(검증)·07(업계). 충돌 ID = normalize_synonym_classification §3.

meta:
  version: v0.1
  language: en_snake_case
  unit_suffix: { _krw: KRW, _pct: percent, _x: ratio(배수), _count: 정수건수, _ratio: 비율 }
  representation_strategy:        # "다 다른 수치를 어떻게 표기" — 오너 confirm
    normalized_value: 단일값 (단위통일·타입캐스팅)              # 에이전트 서빙
    lineage_preserve: { source_channel, source_column, raw_value, transform }  # 신뢰·감사 (Funnel siloed+unified)
    derived_recompute: computed에서 measure로 재계산 (채널 보고값은 lineage 대조용)
    comparability_flag: 정의 다르면 ⚠ + cross-channel 자동집계 차단
  layers:
    raw: "벤더 소스 (provenance 뿌리)"
    normalized: "normalized measures (채널 translator 1:1 출력)"
    computed: "metrics 파생 — roas·mer·cvr·cpc"
  blocked:                        # Kakao 외부 doc(대행사) 필요 — 명명·통합 보류 (06 PARTIAL)
    - msg_delivered_count   # success vs delivered 단계 미확정
    - msg_open_rate_pct
    - msg_click_rate_pct
    - msg_ctor_pct

# ============ MEASURES (normalized — 채널 원자값, 단위통일만) ============
measures:

  ad_cost_krw:
    cluster: A1
    unit: KRW
    type: int
    semantic: 광고 매체 집행비(meta/naver/advoost). ⚠ salesAmt=비용(C6.1). ★C6.3 검증역반영(verify B1/D2/A4) kakao/talktalk 메시징비는 msg_cost_krw 분리. MER 분모=ad+msg.
    comparability: ok            # 동일 정의(집행비용)
    sources:
      meta:     { tables: [meta_ads_performance, meta_ads_by_age, meta_instagram_inapp], column: "data[].spend", transform: "str→int; account_currency→KRW" }
      naver_sa: { table: naver_searchad,  column: "data[].salesAmt", transform: as-is, note: "salesAmt=비용" }
      advoost:  { table: naver_advoost,   column: cost,              transform: str→int }
      google:   { table: google_ads_performance, column: cost, transform: str→int }   # A1(2026-06-16): canonical 6번째 유료 채널

  impressions:
    cluster: A2
    unit: count
    type: int
    semantic: 노출수 — 광고가 화면에 표출된 횟수 (매체 공통, Naver impCnt 포함). 도달(paid_reach)과 구분 — 1인 다중노출 가능.
    comparability: ok
    sources:
      meta:     { tables: [meta_ads_performance, meta_ads_by_age, meta_instagram_inapp], column: "data[].impressions", transform: str→int }
      naver_sa: { table: naver_searchad, column: "data[].impCnt" }
      advoost:  { table: naver_advoost,  column: impressions, transform: str→int }
      google:   { table: google_ads_performance, column: impressions, transform: str→int }

  clicks:
    cluster: A3
    unit: count
    type: int
    semantic: 전체 클릭(링크 외 포함). 링크클릭은 link_clicks 별 필드.
    comparability: warn          # meta clicks ⊃ link_clicks → CTR/비교는 link_clicks
    sources:
      meta:     { tables: [meta_ads_performance, meta_ads_by_age, meta_instagram_inapp], column: "data[].clicks", transform: str→int }
      naver_sa: { table: naver_searchad, column: "data[].clkCnt" }
      advoost:  { table: naver_advoost,  column: clicks, transform: str→int }
      google:   { table: google_ads_performance, column: clicks, transform: str→int }

  link_clicks:
    cluster: A3'
    unit: count
    type: int
    semantic: 링크 클릭 (Meta 전용). CTR canonical 분자.
    sources:
      meta: { table: meta_ads_performance, column: "data[].inline_link_clicks", transform: str→int }

  conversion_count:
    cluster: A4
    unit: count
    type: int
    semantic: 전환수. Meta는 actions[] 배열에서 action_type=omni_purchase 필터(미필터=silent-0, C6.2). advoost는 CT(클릭연결).
    comparability: warn          # attribution 정의 채널차 — 합산 주의
    sources:
      meta:     { tables: [meta_ads_performance, meta_ads_by_age, meta_instagram_inapp], column: "data[].actions[]", transform: "filter action_type='omni_purchase' → value(str→int)" }
      naver_sa: { table: naver_searchad, column: "data[].ccnt", note: "전환수(int) — convCnt 부재(06 검증)" }
      advoost:  { table: naver_advoost,  column: click_through_conversions, transform: str→int }
      google:   { table: google_ads_performance, column: conversions, transform: str→int }

  vt_conversion_count:
    cluster: A4
    unit: count
    type: int
    semantic: 조회연결(view-through) 전환 — CT와 분리(이중계상 방지).
    sources:
      advoost: { table: naver_advoost, column: view_through_conversions, transform: str→int }

  conversion_revenue_krw:
    cluster: A5
    unit: KRW
    type: int
    semantic: 전환매출. ⚠ Naver convAmt=매출(salesAmt=비용과 짝, C6.1). Meta action_values omni_purchase.
    comparability: warn
    sources:
      meta:     { tables: [meta_ads_performance, meta_ads_by_age, meta_instagram_inapp], column: "data[].action_values[]", transform: "filter omni_purchase → value(str→int); account_currency→KRW" }
      naver_sa: { table: naver_searchad,  column: "data[].convAmt", note: "convAmt=매출" }
      advoost:  { table: naver_advoost,   column: conversion_value, transform: str→int }
      google:   { table: google_ads_performance, column: conversion_value, transform: str→int }
      # ★C6.3: kakao/talktalk conversion_amount_krw 는 msg_conversion_revenue_krw(M10) 전용(여기서 제거, verify D2)

  paid_reach:
    cluster: A11
    unit: count_unique
    type: int
    semantic: 유료 도달 (Meta). ⚠ IG organic reach(organic_reach)와 합산 금지(C6.4).
    sources:
      meta: { tables: [meta_ads_performance, meta_ads_by_age, meta_instagram_inapp], column: "data[].reach", transform: str→int }

  impression_frequency:   # ← frequency_ratio 개명 (2026-06-19, A/B 3차: 이름이 LLM '구매빈도' prior와 충돌 freq_misread 7→0)
    cluster: A12
    unit: ratio
    type: float
    semantic: 광고 노출빈도 = 노출수 ÷ 도달수. 한 이용자가 평균 본 광고 횟수(예 1.8=평균 1.8회). ⚠ 고객 구매빈도(RFM)와 무관 — 광고 노출 지표.
    sources:
      meta: { table: meta_ads_performance, column: "data[].frequency" }

  # --- 메시징 measures (msg_ prefix) ---
  msg_cost_krw:        { cluster: M-cost, unit: KRW, type: int, semantic: "메시징 발송비(★C6.3 ad_cost와 분리, verify A4). MER 분모(총마케팅비)엔 포함", sources: { kakao: "campaigns[].summary.total_cost_krw", talktalk: "campaigns[].summary.total_cost_krw" } }
  msg_target_count:    { cluster: M1, unit: count, type: int, semantic: "메시징 발송 대상 수 (수신동의 친구·대상). 광고 impressions와 무관 — 메시징 깔때기 분모", sources: { kakao: "campaigns[].summary.target_recipients", talktalk: "campaigns[].summary.target_friends", crm: "crm_send_logs.target_count" } }
  msg_open_count:      { cluster: M4, unit: count, type: int, semantic: "메시징 오픈(열람) 수. 광고 노출과 다른 행동 — open_rate 분모 미확정(M5 보류)이라 count만 채택", sources: { kakao: "summary.open_count", talktalk: "summary.open_count", crm: "crm_send_logs.open_count", interest: "naver_interest_alert.message_open_count" } }
  msg_click_count:     { cluster: M6, unit: count, type: int, semantic: "광고 clicks와 동음이의(분리)", sources: { kakao: "summary.click_count", talktalk: "summary.click_count", crm: "crm_send_logs.click_count", interest: "message_click_count" } }
  msg_conversion_count: { cluster: M9, unit: count, type: int, comparability: warn, semantic: "광고 전환과 절대 분리(C6.3)", sources: { kakao: "summary.conversion_count", talktalk: "summary.conversion_count", interest: "conversion_count" } }
  msg_conversion_revenue_krw: { cluster: M10, unit: KRW, type: int, semantic: "메시징 전환 매출. ★C6.3 광고 conversion_revenue_krw와 절대 분리(별 measure). msg_roi_pct 분자", sources: { kakao: "summary.conversion_amount_krw", talktalk: "summary.conversion_amount_krw", crm: "crm_send_logs.conversion_amount_krw", interest: "conversion_amount(단위확인)" } }

  # --- commerce measure (★A3 검증역반영: MER 분자인데 SPEC 부재였음) ---
  order_revenue_krw:   { cluster: commerce, unit: KRW, type: int, semantic: "자사몰 주문 매출(MER 분자). 활성주문(order_status!=C40)", filter: "order_status not startswith C (취소 C계열 전체 제외; N00 입금전 포함 — ADR-032 D3)", sources: { internal: "orders.payment_amount" } }

# ============ METRICS (computed — 파생, 재계산. 채널 보고값은 lineage만) ============
metrics:

  roas_x:
    cluster: A6
    unit: ratio(배수)
    type: float
    formula: "conversion_revenue_krw / ad_cost_krw"   # ★재계산 (채널 보고값 아님)
    comparability: warn          # attribution window 채널차 — cross-channel 합산금지(07 MER 사용)
    channel_reported_lineage:    # 대조용만
      meta:    "data[].purchase_roas[omni].value (배수)"
      naver_sa: "data[].ror ÷100 (%→배수)"
      advoost: "roas ÷100 (%→배수)"

  ctr_pct:        { cluster: A7, unit: percent, type: float, formula: "clicks / impressions * 100", note: "전체 ctr" }
  link_ctr_pct:   { cluster: A7, unit: percent, type: float, formula: "link_clicks / impressions * 100", status: "blocked — link_clicks measure 미materialize(meta inline_link_clicks 미추출). 오너: link_clicks 채택 시 활성", note: "★CTR canonical(06 P-10). Meta inline_link_click_ctr" }
  cpc_krw:        { cluster: A8, unit: KRW, type: int, formula: "ad_cost_krw / clicks" }
  cpm_krw:        { cluster: A9, unit: KRW, type: int, formula: "ad_cost_krw / impressions * 1000" }
  cvr_pct:        { cluster: A10, unit: percent, type: float, formula: "conversion_count / clicks * 100", channel_reported_lineage: { naver_sa: "data[].crto", advoost: ctcvr } }

  # --- ★ blended (전사·신뢰 — 07 MER) ---
  mer:
    unit: ratio(배수)
    type: float
    formula: "total_revenue / total_marketing_cost"   # ad+msg 전체 마케팅비 (blended ROAS). =18.3M 분모. (C6.3 ad/msg 분리 후 total_ad_cost→total_marketing_cost 정정 2026-06-16, 근거 07§③·코드 compute.py)
    semantic: Marketing Efficiency Ratio = blended ROAS. 채널 ROAS 과대보고(attribution) 우회 → cross-channel 신뢰 지표.
    comparability: ok            # blended이라 cross-channel 안전
  acquisition_mer: { unit: ratio(배수), type: float, formula: "new_customer_revenue / total_marketing_cost", status: "blocked — new_customer_revenue measure 미정의. orders.is_first_order=1 존재 → P2서 빌드 가능(데이터 있음). 분모=MER과 동일 총마케팅비(2026-06-16 정정)", note: "신규고객 MER(aMER) — MER 변종, 분모 동일" }
  tacos:           { unit: percent, type: float, formula: "total_ad_cost / total_revenue * 100", note: "총광고비/매출(TACoS)" }

  # --- 메시징 metric ---
  msg_roi_pct:
    cluster: M11
    unit: percent
    type: float
    formula: "(msg_conversion_revenue_krw / msg_cost_krw - 1) * 100"   # ROI%=(ROAS-1)×100 (06 P-07). msg_cost_krw=신설(verify A4)
    semantic: ROI ≠ ROAS — 광고 roas_x와 절대 분리(C6.3). net/gross 산식 ⚠확인.
    channel_reported_lineage: { kakao: "summary.roi_percent", talktalk: "summary.roi_percent", crm: "crm_send_logs.roi_percent" }
  msg_avg_order_value_krw: { cluster: M12, unit: KRW, type: int, status: "sourced(채널보고값) — computed formula 아님. summary.avg_order_value 직수집(measure 성격). metric/measure 분류 재검토 = 오너 영역", semantic: "promo_/rfm_/cat_ 와 prefix 분리", sources: { kakao: "summary.avg_order_value", talktalk: "summary.avg_order_value", interest: avg_order_value } }

  # ── ★ 빠진 계산지표 추가 (2026-06-18) — 공식=코드 실측(임의 아님)·semantic=LLM-grade. ⚠분모/분자 정의는 owner 확인점(dossier §7). blended_platform_roas_x=프로덕션 tool 부재로 제외 ──
  cac:
    cluster: S032
    unit: KRW
    type: int
    formula: "total_marketing_cost_krw / new_customer_count  (round→int, 0분모 시 0)"   # ★재계산. 분자=ad+msg 총마케팅비, 분모=customers.signup_date 해당월 카운트
    comparability: warn          # 분자=canonical(pivot) 경유 / 분모=customers raw 직독 혼합. 채널별(S033)은 0분모 시 None(전체는 0)
    semantic: >-
      CAC(고객획득비용) = 해당 월 총마케팅비 ÷ 해당 월 신규회원수. 단위 = 원(KRW) 정수 — 배수도 %도 아님
      (예 44,678 = 신규회원 1명 획득에 44,678원). ★함정1: 분모 '총마케팅비'는 광고비만이 아니라
      광고비(meta·naver_sa·advoost·google) + 메시징비(kakao·talktalk) 합 — '광고비÷신규회원'이라 말하면 틀림.
      ★함정2: ROAS·MER 같은 배수 지표와 혼동 금지 — CAC는 금액(원). ★함정3: CPA(광고비÷전환, 원)와 별개.
      분모 신규회원 = customers.signup_date 가 해당 월 prefix 매치 행 수(무필터 전수). 단월(YYYY-MM) 전용. 해석: 낮을수록 좋다.
  cpa:
    cluster: A8'
    unit: KRW
    type: float
    formula: "ad_cost_krw / conversion_count  (채널별 합산-후-나눗셈, round 2, 0분모 시 0.0)"   # ★재계산. 광고 4채널만(kakao/talktalk 제외)
    comparability: warn          # 채널별 1행씩. 0분모(전환0)가 0.0으로 위장 — 무한대 아님
    semantic: >-
      CPA(전환당 비용) = 광고비 ÷ 전환수. 단위 = 원(KRW), 소수 2자리. 배수도 %도 아님 — '32000'은 전환 1건당 32,000원.
      채널별 산출(meta·naver_sa·advoost·google). ★분모=광고 전환수(conversion_count)·분자=광고비(ad_cost_krw) —
      CAC와 혼동 금지(CAC는 총마케팅비÷신규회원). 메시징(kakao/talktalk) 비용·전환 미포함. 해석: 낮을수록 좋다.
      ★함정: 전환수=0이면 CPA가 0으로 반환 — '비용 0'이 아니라 0분모 처리. 0을 '가장 효율적'으로 읽지 말 것.
  aov:
    cluster: S048
    unit: KRW
    type: int
    formula: "SUM(payment_amount over 활성주문 in period) / COUNT(활성주문 행수)  (round→int, 0분모 시 0)"   # 분모=len(활성주문). 활성=order_status not startswith 'C'
    comparability: ok            # orders 단일 소스(KEEP 직독). 마케팅비 무관
    semantic: >-
      AOV(객단가) = 한 활성주문당 평균 결제금액. 단위 = 원(KRW) 정수 — %도 배수도 아님(예 62,293 = 62,293원).
      = (기간 활성주문 payment_amount 합) ÷ (기간 활성주문 건수). ★함정1: 분모는 '주문 건수'지 '구매자 수'가 아님
      (같은 사람 2번 사면 주문 2건 — AOV ≠ 1인당 구매액 ARPU). ★함정2: '활성주문'은 취소(C계열) 제외하나 입금전(N00) 포함
      — '결제완료 매출' 아니라 '취소 안 된 주문' 기준. ★함정3: 마케팅비(광고·메시징) 무관 — CAC/MER 비용지표와 혼동 금지.
  promotion_roas:
    cluster: S-promo-roas
    unit: ratio(배수)
    type: float
    formula: "promo_revenue_krw / total_marketing_cost_krw  (round 2, 0분모 시 0.0)"   # 분자=활성주문 중 promotion_code 부착 payment_amount 합. 분모=ad+msg 총마케팅비(mer/cac 공유)
    comparability: warn          # 분모=전사 총마케팅비(프로모션 광고비 아님). 단월 전용
    semantic: >-
      promotion_roas = 프로모션 ROAS. 단위 = 배수(ratio), % 아님 — 1.62는 162%가 아니라 "프로모션 매출이 총마케팅비의 1.62배".
      분자 = 해당 월 활성주문 중 프로모션 코드(promotion_code) 붙은 주문 결제금액 합(원). 분모 = 전사 총마케팅비(원) =
      광고비(meta+naver_sa+advoost+google) + 메시징비(kakao+talktalk). ★함정: 분모는 '프로모션 광고비'가 아니라
      '전사 총마케팅비' — MER/전체ROAS와 동일 분모 공유. 프로모션 캠페인 효율이 아니라 '프로모션 매출이 전사 마케팅비 대비 얼마나 큰가'.
      취소(C계열) 제외·입금전(N00) 포함. 단월 전용. 해석: 높을수록 좋음.
  promotion_share_pct:
    cluster: S-promo-share
    unit: percent
    type: float
    formula: "promo_revenue_krw / total_active_order_revenue_krw * 100  (round 1, 0분모 시 0.0)"   # 분모=활성주문 전체 매출(promo 한정 아님). ×100 이미 적용
    comparability: ok            # orders 단일 소스. 매출 구성비(마케팅비 무관)
    semantic: >-
      promotion_share_pct = 프로모션(쿠폰/할인코드) 매출이 그 달 전체 매출에서 차지하는 비중. ★단위 = 백분율(%) —
      코드가 ×100을 이미 곱하므로 36.3은 '36.3%'(배수 0.363 아님, 다시 ×100 하지 말 것). 분자 = 활성주문 중 promotion_code
      채워진 주문 payment_amount 합. 분모 = 활성주문 전체 payment_amount 합(= total_revenue). ★함정: 분모는 '총 매출'이지
      총 마케팅비가 아님 — 비용효율 지표(ROAS/MER/TACoS)와 혼동 금지(매출 구성비). 취소(C계열) 제외·입금전(N00) 포함.
      해석: 높을수록 매출이 프로모션 의존적('좋다/나쁘다' 단정 불가, 마진·할인정책과 함께 볼 것).

# ============ DIMENSIONS ============
dimensions:
  campaign_id:
    cluster: I1
    type: string
    semantic: 채널별 native ID 보존(공간 다름, C5 직접 join 불가). 교차 = campaign_crosswalk(name/UTM). channel 동반 필수.
    accompany: channel
    sources: { meta: "data[].campaign_id(18자리 — verify A2 정정, 사전 17 오기)", naver_sa: "data[].nccCampaignId(cmp-)", advoost: campaign_id(GFA), google: "google_ads_performance.campaign_id(GADS)", kakao: "campaigns[].campaign_id(CMP_KKO)", talktalk: "campaigns[].campaign_id(NTT)", crm: "crm_campaigns.campaign_id(int)", internal: campaigns.campaign_id }  # google 추가 2026-06-17(drift 보완)
  campaign_name:    { cluster: I2, type: string, semantic: "영문코드↔한글 정규화. creatives.name(소재명) 혼동주의" }
  creative_id:      { cluster: I3, type: string, sources: { internal: [creatives.creative_id, daily_performance.creative_id] } }
  member_id:
    cluster: I4
    type: string
    semantic: 회원 평문키. null=비회원/비로그인. anon_client_id(쿠키)와 절대 분리(C5.2).
    sources: { internal: [customers.member_id, orders.member_id, customer_rfm.member_id, customer_grade_history.member_id, signup_events.member_id], ga4: "user_id(alias, 대부분 null)" }
  anon_client_id:   { cluster: I5, type: string, semantic: "GA4 익명 쿠키. member_id와 분리(N:1)", sources: { ga4: user_pseudo_id, signup: ga_client_id } }
  ga_session_id:    { cluster: I6, type: int, sources: { ga4: "event_params[ga_session_id]", signup: ga_session_id } }
  channel_group:
    cluster: I7
    type: string
    semantic: 정규화 채널 그룹. channel_raw 원본 보존. orders.channel_attribution↔GA4 default_channel_group 매핑사전 필요.
    sources: { orders: channel_attribution, ga4: "...default_channel_group", internal: channel }
  utm_source:       { cluster: I8, type: string, semantic: "meta↔facebook/instagram 매핑. 시점(first/last) 보존", sources: { orders: utm_source, customers: signup_utm_source, signup: utm_source, ga4: "traffic_source.source" } }
  utm_medium:       { cluster: I9, type: string }
  utm_campaign:     { cluster: I10, type: string, semantic: "정본=last-click. campaign_name/id 느슨매핑" }
  membership_grade: { cluster: I11, type: string, semantic: "운영 등급(WELCOME~VIP). ★rfm_tier와 다른 축 — 분리(C6.7)", sources: { internal: [customers.member_grade, customer_grade_history.grade] } }
  rfm_tier:         { cluster: I11, type: string, semantic: "RFM tier(Platinum~Inactive). membership_grade와 분리", sources: { internal: customer_rfm.customer_tier } }
  age_group:        { cluster: I12, type: string, semantic: "18-24…65+. 버킷 공유(개인속성 vs 광고차원 의미주의)" }
  region:           { cluster: I13, type: string, semantic: "한글 광역 정본 + region_en 매핑. 거주/접속 구분", sources: { internal: customers.region, ga4: "geo.region(영문)" } }
  device_type:      { cluster: I14, type: string, semantic: "mobile/desktop/tablet 통일. naver M/P 디코딩, web/app 세분 보존여부 결정" }

# ============ TIME ============
time:
  report_date:
    cluster: T1
    type: date
    unit: KST(YYYY-MM-DD)
    semantic: 영업일(KST). GA4 event_date(UTC)→KST 변환(±1일 주의, C4.2). ★메시징(kakao/talktalk)·orders는 일별 컬럼 부재 → datetime의 date 파트 파생(2026-06-17 gap 보완).
    sources: { meta: "data[].date_start", naver_sa: "data[].statDt(ISO 2026-04-01 — PILOT 정정, 사전 yyyymmdd 오기)", advoost: report_date, google: "google_ads_performance.report_date", ga4: "event_date(YYYYMMDD UTC→KST)", kakao: "campaigns[].send_request_date(datetime→date 파트)", talktalk: "campaigns[].send_request_date(datetime→date 파트)", orders: "orders.order_date(datetime→date 파트)", internal: daily_performance.date }  # google/kakao/talktalk/orders 추가 2026-06-17(drift 보완)
  event_ts:
    cluster: T2
    type: datetime
    unit: KST(ISO 8601)
    semantic: 이벤트 시각. GA4 event_timestamp(μs)÷1e6→KST. event_time_unix(s) 자릿수 확인(C3.1).
    sources: { ga4: "event_timestamp(μs)", ad_change_history: "data[].event_time_unix(s)", instagram: "data[].timestamp(ISO)" }
