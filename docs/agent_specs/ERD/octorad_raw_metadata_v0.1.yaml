- table: meta_ads_performance
  vendor: Meta
  api_or_source: Meta Marketing API — Ad Insights API (/{ad-account-id}/insights, level=campaign, time_increment=1)
  doc_url: https://developers.facebook.com/docs/marketing-api/insights/
  grain: 일×캠페인 (date_start=date_stop, time_increment=1; 90행 = 일별 캠페인 집계)
  family: ad_performance
  format: 'json (wrapper: data[]=90, paging)'
  row_count: 90
  pii_flag: false
  table_description: 'Meta(Facebook/Instagram) 캠페인 단위 일별 광고 성과. Ads Insights API 응답을 data[] 배열로 래핑. 핵심 지표(spend/impressions/clicks/reach/frequency/cpc/cpm/ctr)는
    평탄 컬럼, 전환계(actions/action_values/purchase_roas/cost_per_action_type)는 {action_type,value} 중첩 배열 — purchase 추출 시 action_type=''omni_purchase''
    필터 필수(미필터=silent-0, C6.2). 전 수치 컬럼이 string 직렬화(C3.2). 금액은 account_currency 의존(KRW 단정 불가, C2.2). 커버: data[].* 전 leaf + 중첩 액션배열 대표.'
  columns:
  - path: data[].account_id
    type: string
    description: Meta 광고 계정 ID (예 act_847251963)
    unit: null
    source: vendor_doc
    confidence: high
    is_key: true
    semantic_note: ad_change_history._meta.ad_account_id 와 연결. dict 예시 act_ 접두.
  - path: data[].account_name
    type: string
    description: 광고 계정 이름 (예 C:LUMI Korea)
    unit: null
    source: dict
    confidence: high
    is_key: false
    semantic_note: null
  - path: data[].account_currency
    type: string
    description: 계정 통화 코드 (ISO 4217). spend/cpc/cpm/conversion-value 의 통화 정본
    unit: currency_code
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: 'C2.2: mock 은 KRW 로 보이나 실 API 는 USD/현지통화 가능 → 금액 KRW 강제 가정 금지.'
  - path: data[].campaign_id
    type: string
    description: Meta 캠페인 고유 ID (18자리 숫자 문자열)
    unit: null
    source: vendor_doc
    confidence: high
    is_key: true
    semantic_note: 'I1/C5.1: Meta 전용 ID 공간. naver(cmp-)/advoost(GFA)/kakao(CMP_KKO)/CRM(int) 와 직접 join 불가 — campaign_name/utm 매핑테이블로만 연결.'
  - path: data[].campaign_name
    type: string
    description: 캠페인명 (CLUMI_시즌_유형_제품 규칙, 예 CLUMI_SPR_PROSP_Serum)
    unit: null
    source: dict
    confidence: high
    is_key: false
    semantic_note: 'I2: cross-channel 연결의 실질 키(utm_campaign 과 매핑).'
  - path: data[].objective
    type: string
    description: 캠페인 목표 (예 OUTCOME_SALES/OUTCOME_TRAFFIC 등 Meta 캠페인 objective)
    unit: null
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: null
  - path: data[].buying_type
    type: string
    description: 구매 방식 (AUCTION / RESERVED)
    unit: null
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: null
  - path: data[].attribution_setting
    type: string
    description: 전환 어트리뷰션 설정 (예 7d_click 또는 7d_click_or_1d_view). actions/action_values 의 귀속 창을 규정
    unit: null
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: 전환수/매출 비교 시 채널 간 어트리뷰션 창 차이의 근거(A4/A5 합산 주의).
  - path: data[].date_start
    type: date
    description: 리포트 일자 시작 (YYYY-MM-DD)
    unit: null
    source: vendor_doc
    confidence: high
    is_key: true
    semantic_note: 'T1: 일별 grain 이라 date_stop 과 동일. naver statDt(YYYYMMDD)/GA4 event_date(UTC) 와 포맷·TZ 충돌(C4.1/C4.2). KST 영업일 가정.'
  - path: data[].date_stop
    type: date
