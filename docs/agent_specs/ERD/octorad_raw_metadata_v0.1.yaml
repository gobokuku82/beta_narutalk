  vendor: Kakao i Connect Message (카카오 i 커넥트 메시지) — BizMessage 친구톡(FT)/알림톡(AT)
  api_or_source: BizMessage 발송결과 조회 API 응답 (campaigns[] = 캠페인별 발송 통계 + results_sample[] = 개별 발송 결과 표본). 최상위 = 쿼리 응답 래퍼(code/status/next/query_date_range).
  doc_url: https://docs.kakaoi.ai/kakao_i_connect_message/bizmessage_eng/api/api_reference/
  grain: 캠페인 누계 (campaigns[] 1행 = 1 캠페인, summary.* = 캠페인 전체 롤업). results_sample[] 는 개별 발송 grain (별도 — 합산 금지).
  family: messaging
  format: json
  row_count: 2
  pii_flag: true
  table_description: '카카오 비즈메시지(친구톡 FT=광고/정보성·채널 친구 한정, 알림톡 AT=정보성·비친구 포함) 캠페인 발송 성과. 벤더(Kakao i Connect Message) 발송결과 조회 API 응답 스키마가 의미의 정본.
    구조 3층: (1) 최상위 래퍼=쿼리 응답 메타(code/status/next/query_date_range), (2) campaigns[].summary.*=캠페인별 발송→오픈→클릭→전환 깔때기 누계 통계, (3) campaigns[].results_sample[]=개별
    발송 결과 표본(다른 grain). 금액은 KRW(_krw 접미 또는 명시). PII: results_sample[].phone_number_hash=해시(평문 아님, 완화됨). 커버: 핵심 식별·발송메타·summary 전수 + results_sample[]
    대표 컬럼(개별 결과코드 구조). roi_percent=ROI≠ROAS(C6.3).'
