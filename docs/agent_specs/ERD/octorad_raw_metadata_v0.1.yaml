    confidence: high
    is_key: false
    semantic_note: null
  - path: data[].spend
    type: string
    description: 광고비 (집행 비용)
    unit: account_currency (KRW 추정)
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: 'A1/T3: string 직렬화(C3.2). naver salesAmt(=비용, C6.1)·advoost cost 와 동의어. 통화 account_currency 의존.'
  - path: data[].impressions
