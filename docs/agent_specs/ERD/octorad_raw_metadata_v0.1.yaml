    semantic_note: 'A3: clicks(all) 의 부분집합. CTR/CPC canonical 결정 시 clicks vs link-clicks 선택 대상.'
  - path: data[].ctr
    type: string
    description: CTR — 클릭률 = clicks / impressions × 100
    unit: percent
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: 'A7: %. dict 예시 0.91=0.91%. inline_link_click_ctr(링크 한정)과 분자 다름.'
  - path: data[].inline_link_click_ctr
    type: string
    description: 링크 클릭률 = inline_link_clicks / impressions × 100
    unit: percent
    source: vendor_doc
    confidence: high
    is_key: false
    semantic_note: ctr(all) 과 별개 정의.
  - path: data[].cpc
    type: string
    description: CPC — 클릭당 비용 = spend / clicks
