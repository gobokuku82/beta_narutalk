[pytest]
# pytest 설정 파일

# 테스트 디렉토리
testpaths = tests

# 파이썬 경로
pythonpath = .

# 테스트 파일 패턴
python_files = test_*.py

# 테스트 클래스 패턴
python_classes = Test*

# 테스트 함수 패턴
python_functions = test_*

# 커버리지 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=backend
    --cov-report=html:reports/coverage_html
    --cov-report=term-missing
    --cov-report=json:reports/coverage.json

# 마커 정의
markers =
    unit: 단위 테스트
    integration: 통합 테스트
    e2e: End-to-End 테스트
    performance: 성능 테스트
    slow: 느린 테스트
    asyncio: 비동기 테스트

# 비동기 테스트 모드
asyncio_mode = auto

# 로그 캡처
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning