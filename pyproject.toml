[project]
name = "dreamagent"
version = "0.1.0"
description = "DreamAgent — domain-agnostic 4-layer agent framework (LangGraph)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=12.0",
    "anthropic>=0.69.0",
    "openai>=1.109.1",
    "langgraph>=1.1.6",
    "langgraph-checkpoint-postgres>=2.0.25",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.10",
    "psycopg-pool>=3.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "structlog>=25.5.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0.1",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["test"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: 실제 LLM/외부 API 호출 필요 (비용 발생, opt-in 실행)",
    "docs: 문서-코드 계약 검증 (drift 검출용, opt-in 실행)",
    "perm: ADR-027 5 주체 권한 분리 정적 검증 (DC-PERM-1~6). 기본 수트 포함 — 진단 리포트는 -s 로 확인",
]
# live / docs 마커는 기본 실행에서 제외. 명시적 실행: pytest -m live 또는 pytest -m docs
addopts = "-m 'not live and not docs'"
