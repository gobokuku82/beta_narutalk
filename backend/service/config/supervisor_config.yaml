# Medical Supervisor Configuration
# 의료/제약 도메인 Supervisor 설정

# LangGraph Settings
langgraph:
  version: "0.6.7"
  supervisor_version: "0.0.29"
  checkpoint:
    type: "sqlite"
    path: "./checkpoints/supervisor.db"
  store:
    type: "memory"
    max_size: 1000

# LLM Configuration
llm:
  default_provider: "openai"
  models:
    openai:
      model: "gpt-4o"
      temperature: 0.1
      max_tokens: 4000
      timeout: 60
    anthropic:
      model: "claude-3-opus-20240229"
      temperature: 0.1
      max_tokens: 4000
      timeout: 60

# Agent Configuration
agents:
  sql_analysis_agent:
    enabled: true
    max_concurrent_tasks: 5
    timeout: 60
    cache_ttl: 600  # 10 minutes
    tools:
      - sql_query
      - data_aggregation
      - trend_analysis
      - statistical_analysis
    specialties:
      - "실적분석"
      - "트렌드분석"
      - "데이터집계"

  information_retrieval_agent:
    enabled: true
    max_concurrent_tasks: 10
    timeout: 45
    cache_ttl: 900  # 15 minutes
    tools:
      - search
      - retrieval
      - web_search
      - document_search
      - api_integration
    specialties:
      - "정보검색"
      - "웹검색"
      - "문서검색"

  document_generation_agent:
    enabled: true
    max_concurrent_tasks: 3
    timeout: 90
    cache_ttl: 300  # 5 minutes
    tools:
      - document_generation
      - template_processing
      - formatting
      - data_storage
      - report_creation
    specialties:
      - "문서생성"
      - "보고서작성"
      - "양식작성"

  compliance_validation_agent:
    enabled: true
    max_concurrent_tasks: 2
    timeout: 60
    cache_ttl: 1800  # 30 minutes
    tools:
      - compliance_check
      - regulation_validation
      - risk_assessment
      - policy_review
    specialties:
      - "규정검토"
      - "위험평가"
      - "정책검토"

# Execution Settings
execution:
  max_parallel_tasks: 3
  default_timeout: 60
  retry_strategy:
    max_retries: 3
    initial_delay: 2.0
    backoff_factor: 1.5
    max_delay: 30.0

  # Priority Settings
  priority_levels:
    high:
      weight: 1.5
      max_latency: 15
    medium:
      weight: 1.0
      max_latency: 30
    low:
      weight: 0.7
      max_latency: 60

# Context Engineering
context:
  max_context_length: 8000
  optimization_enabled: true
  handoff_message_removal: true
  forward_message_enabled: true

  # Domain-specific settings
  domains:
    실적분석:
      preferred_agent: "sql_analysis_agent"
      required_capabilities:
        - sql_query
        - data_aggregation
        - trend_analysis
    정보검색:
      preferred_agent: "information_retrieval_agent"
      required_capabilities:
        - search
        - retrieval
    문서생성:
      preferred_agent: "document_generation_agent"
      required_capabilities:
        - document_generation
        - template_processing
    규정검토:
      preferred_agent: "compliance_validation_agent"
      required_capabilities:
        - compliance_check
        - regulation_validation

# Database Configuration
database:
  structured_db:
    host: "${DB_HOST}"
    port: 5432
    database: "${DB_NAME}"
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
    pool_size: 10
    max_overflow: 20

  unstructured_db:
    type: "mongodb"
    connection_string: "${MONGO_CONNECTION_STRING}"
    database: "medical_docs"

  vector_db:
    type: "chromadb"
    persist_directory: "./chroma_db"
    embedding_model: "text-embedding-3-small"

# Cache Configuration
cache:
  enabled: true
  type: "redis"
  redis:
    host: "${REDIS_HOST}"
    port: 6379
    db: 0
    password: "${REDIS_PASSWORD}"
    ttl_default: 600  # 10 minutes

# External APIs
external_apis:
  fastapi_server:
    base_url: "http://localhost:8000"
    timeout: 30
    retry_count: 3

  naver_api:
    enabled: true
    api_key: "${NAVER_API_KEY}"
    secret_key: "${NAVER_SECRET_KEY}"

  google_api:
    enabled: true
    api_key: "${GOOGLE_API_KEY}"
    custom_search_id: "${GOOGLE_CUSTOM_SEARCH_ID}"

  hira_api:
    enabled: true
    base_url: "https://apis.data.go.kr/B551182"
    service_key: "${HIRA_SERVICE_KEY}"

  paper_search:
    enabled: true
    pubmed_api: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils"
    arxiv_api: "http://export.arxiv.org/api/query"

# Medical Domain Settings
medical:
  regulations:
    - "의료법"
    - "리베이트법"
    - "공정거래규약"
    - "개인정보보호법"

  compliance_levels:
    strict:
      description: "모든 규정 철저히 검토"
      required_agents:
        - "compliance_validation_agent"
    normal:
      description: "일반적인 규정 준수"
      optional_agents:
        - "compliance_validation_agent"
    relaxed:
      description: "최소한의 규정 확인"
      optional_agents: []

  metadata_tables:
    - sales_performance
    - client_trends
    - employee_info
    - regulation_docs

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file:
    enabled: true
    path: "./logs/supervisor.log"
    max_size: "100MB"
    backup_count: 10
  console:
    enabled: true
    colored: true

# Monitoring & Metrics
monitoring:
  enabled: true
  prometheus:
    enabled: false
    port: 9090
  custom_metrics:
    track_agent_performance: true
    track_query_patterns: true
    track_error_rates: true
    retention_days: 30

# Security Settings
security:
  authentication:
    enabled: true
    type: "jwt"
    secret_key: "${JWT_SECRET_KEY}"
    algorithm: "HS256"
    expire_minutes: 1440  # 24 hours

  rate_limiting:
    enabled: true
    requests_per_minute: 60
    requests_per_hour: 1000

  data_encryption:
    enabled: true
    algorithm: "AES-256-GCM"
    key: "${ENCRYPTION_KEY}"

# Development Settings
development:
  debug_mode: false
  hot_reload: false
  mock_agents: false
  test_mode: false

# Performance Tuning
performance:
  thread_pool_size: 10
  connection_pool_size: 20
  batch_size: 100
  prefetch_count: 10

  optimization:
    enable_caching: true
    enable_parallel_execution: true
    enable_lazy_loading: true
    enable_query_optimization: true