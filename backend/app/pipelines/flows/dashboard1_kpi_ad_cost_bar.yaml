name: dashboard1_kpi_ad_cost_bar
visualization_id: C02
category: dashboard1
description: "5 매체 광고비 BarChart — K02 cache 재사용 (동일 tool·동일 key)"
methodology_id: M04
priority: P0
client: ${client}
period: ${period}

trigger:
  type: manual

# cache 공유: dashboard1_kpi_ad_cost (K02) 와 동일 key_template →
# K02 가 먼저 실행됐으면 cache hit (load only), 아니면 같은 chain 실행. 데이터 중복 0.
steps:
  - id: ad_cost_aggregate
    tool: ad_cost_total
    inputs:
      client: ${client}
      period: ${period}

validator:
  schema: AdCostOutput
  expected:
    value_min: 0
  fail_policy: alert

cache:
  layer: normalized
  key_template: "ad_cost_total_${period}.json"
  ttl_seconds: null

owner: developer
tags: [ad_cost, chart, dashboard1, cache_shared]
