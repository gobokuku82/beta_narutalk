name: dashboard1_kpi_revenue
visualization_id: K01
category: dashboard1
description: "Dashboard1 총 매출 KPI (단일 값) — Batch 1 Runner walking skeleton"
methodology_id: M01
priority: P0
client: ${client}
period: ${period}

trigger:
  type: manual

# NOTE (M1): spec 68 §6.1.1 은 tool: RevenueTotal (클래스명) 으로 적었으나,
# registry 는 catalog `name:` (snake_case) 로 조회 → tool: revenue_total 로 표준화.
# orders_load = 현 tool 이 self-load 라 중복이나, multi-step·topo·previous_results 검증용.
# M2 (ADR-027 리팩터) 에서 revenue_total 이 orders_load 산출을 previous_results 로 소비하도록 전환.
steps:
  - id: orders_load
    tool: orders_collector
    inputs:
      client: ${client}

  - id: revenue_compute
    tool: revenue_total
    inputs:
      client: ${client}
      period: ${period}
    depends_on: [orders_load]

validator:
  schema: RevenueOutput
  expected:
    value_min: 0
  fail_policy: alert

cache:
  layer: computed
  key_template: "S001_revenue_total_${period}.json"
  ttl_seconds: null

owner: developer
tags: [revenue, kpi, dashboard1]
