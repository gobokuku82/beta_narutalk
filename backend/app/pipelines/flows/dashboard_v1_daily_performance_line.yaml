name: dashboard_v1_daily_performance_line
visualization_id: C04
category: dashboard_v1
description: "일별 성과 LineChart — date 별 광고비·전환매출 2 시리즈"
methodology_id: M03
priority: P0
client: ${client}
period: ${period}

trigger:
  type: manual

steps:
  - id: daily_perf_aggregate
    tool: daily_performance_aggregate
    inputs:
      client: ${client}
      period: ${period}
      metrics: [ad_cost, conversion_revenue]

validator:
  schema: DailySeriesOutput
  expected:
    rows_min: 1
  fail_policy: alert

cache:
  layer: normalized
  key_template: "daily_performance_line_${period}.json"
  ttl_seconds: null

owner: developer
tags: [daily, line, dashboard_v1, timeseries]
