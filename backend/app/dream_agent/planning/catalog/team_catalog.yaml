# 새 도메인은 아래 구조로 채운다:
#
# teams:
#   <team_name>:
#     description: "팀 설명"
#     agents:
#       <agent_name>:
#         description: "에이전트 설명"
#         handles_tasks: ["<task_type>", ...]   # open-vocab task 라우팅 키
#         tools:
#           - name: <tool_name>
#             status: implemented      # implemented | stub
#             description: "도구 설명"

teams: {}
