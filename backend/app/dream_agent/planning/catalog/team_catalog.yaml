  # ─────────────────────────────────────────────────────────────
  qa_team:
    description: "질의응답 — 개념정의·시스템메타·대화를 지식·설명으로 답변 (데이터 파이프 우회)"
    agents:

      qa_agent:
        description: "질의응답 단일 agent — qa_responder 로 LLM 직접 답변. RAG·종류분기는 추후(설계서 §5)."
        handles_tasks: [factual_lookup]
        tools:
          - name: qa_responder
            status: implemented
            description: "질의응답 — 데이터 계산이 아닌 지식·메타·대화로 답변. 질문(tool_params 주입)+용어집+능력 → LLM. RAG hook 자리만."
            params_required: []   # question 은 planner 가 tool_params 로 *주입*(데이터흐름 의존 아님). in-tool 가드가 빈질문 방어.
            produces: [answer]

  # ─────────────────────────────────────────────────────────────
  # 의사결정팀 (Decision Team) — 2026-06-10 신설 (의사결정_설계서_260610.md)
  # 데이터/분석 → 행동 제안(옵션→시뮬→추천→승인). 현: 단일 recommender(추천).
  # recommender = ml_model.generate_recommendation(Mock) 재사용 — 상류 분석 없어도 작동(mock).
  # ─────────────────────────────────────────────────────────────
  decision_team:
    description: "의사결정 — 데이터/분석을 바탕으로 행동(무엇을 할지) 제안. 현 단계=추천."
    agents:

      decision_agent:
        description: "의사결정 단일 agent — recommender 로 행동 추천. 옵션·시뮬은 추후, 승인=stage3(설계서 §2)."
        handles_tasks: [recommendation]
        tools:
          - name: recommender
            status: implemented
            description: "추천 — 데이터/분석 → 행동 제안(우선순위). ml_model.generate_recommendation(POC=Mock/MVP+=Llm). mock 은 상류 무시·fixture 반환."
            params_required: []   # mock 은 context 무시(fixture). 실모델 swap 시 previous_results(분석 산출) 소비.
            produces: [recommendations, count, recommendation_text]

  # ─────────────────────────────────────────────────────────────
  # 3팀 — 운영팀 (Operations Team) — MVP+
  # ─────────────────────────────────────────────────────────────
  # operations_team: (POC 범위 외)

# ==============================================================
# Task → Agent 기본 매핑 힌트 (LLM이 참조하는 가이드, 강제 아님)
# 2026-05-18 D9 + D13 Y 반영 갱신:
#   - data_preprocessing: 2 갈래 (text_preprocessing_agent / channel_normalizing_agent — LLM 선택)
#   - insight/summary: report_text_agent
#   - report_generation: 4 갈래 (report_text / pdf / excel / ppt — output_format 별 LLM 분기)
# ==============================================================

task_agent_hints:
  data_collection:        collection_agent
  data_preprocessing:     [text_preprocessing_agent, channel_normalizing_agent]   # ⭐ D9 두 갈래
  sentiment_analysis:     analysis_agent
  keyword_extraction:     analysis_agent
  trend_analysis:         analysis_agent
  competitor_comparison:  analysis_agent
  causal_analysis:        analysis_agent
  metric_calculation:     metrics_agent                                           # ⑰.C 신 (KPI 질의 페어)
  insight_generation:     report_text_agent                                       # ⭐ D13 rename
  report_generation:      [report_text_agent, pdf_agent, ppt_agent]  # (2026-06-12) excel_agent 폐기 → 3 갈래
  summary_generation:     report_text_agent                                       # ⭐ D13 rename
  # (2026-06-12) creative 계열 hint 5종(image_generation/image_editing/video_storyboard/
  # copy_generation/material_variation) 제거 — creative_team 폐기. task type 은 언어
  # 레이어(schemas TaskType)에 유지 — 인식은 하되 배정 agent 없음 = 정직 미지원.
  factual_lookup:         qa_agent   # 질의응답 — qa_responder 결정론 라우팅(2026-06-10, 구: null=LLM직답 가정)
  recommendation:         decision_agent   # 의사결정 — recommender (2026-06-10 의사결정 카테고리)

# ==============================================================
# 암묵적 선행 의존성 (Planning이 자동 삽입)
# task type 은 유지 — data_preprocessing 한 task → 두 agent 중 LLM 선택
# ==============================================================

implicit_prerequisites:
  # 분석 계열 task들은 전부 data_collection + data_preprocessing 선행 필요
  # ⑰.C (2026-06-01): metric_calculation append (KPI = 정제 raw 필요, list-of-dicts 정합)
  - tasks_requiring_data:
      [sentiment_analysis, keyword_extraction, trend_analysis,
       competitor_comparison, causal_analysis, insight_generation,
       metric_calculation]
    prerequisites: [data_collection, data_preprocessing]

  # 보고서 생성은 최소 1개 분석 결과 선행 필요
  - tasks_requiring_analysis:
      [report_generation, summary_generation]
    prerequisites_at_least_one:
      [sentiment_analysis, keyword_extraction, insight_generation, trend_analysis]
