# Team → Agent → Tool 카탈로그 — Planning 레이어 라우팅 소스
#
# 프레임 추출(2026-06-19): 마케팅 도메인 팀/에이전트/도구 정의 제거. 빈 골격.
# AgentPool.load() 는 `teams or {}` 로 빈 카탈로그를 허용(teams 0 / agents 0 로 부팅).
