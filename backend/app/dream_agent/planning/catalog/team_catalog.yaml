# Todo[] + DAG로 변환한다.
#
# 10 에이전트:
#   chat_hub (Cognitive Stage 내부 — 본 카탈로그 외)
#   analysis_team 7: collection / text_preprocessing / channel_normalizing /
#                    analysis / report_text / pdf / ppt
#   (2026-06-12 폐기) creative_team — 외부 API·제품 결정 필요 영역으로 POC 범위 외 확정 (spec 32 §7.1)
#
# Reference:
# - docs/agent_specs/17_functions_to_io_v1.0.md  (종단 매핑)
# - docs/agent_specs/40_agent_tool_lifecycle_v1.0.md  (변경 절차)
# - docs/_claude/tool/TOBE_MVP/03_drift_report.md D9 + D13
# - backend/app/dream_agent/schemas/structured_query.py  (TaskType enum)
#
# 표기:
#   status: implemented  — 현재 POC에 실제 구현 있음 (2026-06-12 부로 전 tool implemented)
#   (status: stub 제도 폐지, 2026-06-12 오너 결정 "구현하면서 줄이자" 완결 —
#    mock_tools "되는 척" 경로 삭제. 비구현 tool 은 카탈로그 등재 금지: 등재되면
#    executor 가 시끄럽게 실패한다. 미구현 의도는 코드 Status: planned 마커로.)
# ==============================================================

