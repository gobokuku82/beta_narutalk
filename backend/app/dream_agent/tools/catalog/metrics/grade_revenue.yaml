name: grade_revenue
description: "등급별 회원수·매출 표 (S046) — orders × customers join. methodology §S046"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM (단월). orders.order_date prefix"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - table                       # dict[grade, {member_count, member_share_pct, buyer_count, revenue, revenue_share_pct}]
  - total_members               # int — customers 전체 (8500)
  - total_member_revenue        # int — 회원 매출 합 (비회원 제외) — 매출 비중의 분모
  - silver_revenue              # int — SILVER 단일 매출 (회귀 검증용)
  - welcome_member_share        # float — WELCOME 회원 비중 (회귀 검증용, 74.5%)

has_cost: false
estimated_cost: 0.0

tags: [clumi, metrics, grade, methodology_S046]

clumi_methodology: "calculations"
clumi_source_ids: ["S046"]
clumi_answer_values:
  "2026-04":
    silver_revenue: 65757080
    welcome_member_share: 74.5
    total_members: 8500
    grades:
      VIP: { member_count: 0, member_share_pct: 0.0,  buyer_count: 0,   revenue: 0 }
      GOLD: { member_count: 28, member_share_pct: 0.3, buyer_count: 28, revenue: 8511200 }
      SILVER: { member_count: 600, member_share_pct: 7.1, buyer_count: 571, revenue: 65757080 }
      REGULAR: { member_count: 1539, member_share_pct: 18.1, buyer_count: 787, revenue: 39496930 }
      WELCOME: { member_count: 6333, member_share_pct: 74.5, buyer_count: 0, revenue: 0 }

storage:
  layer: "computed"
  key_template: "S046_grade_revenue_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
