tags: [clumi, metrics, segment, age, methodology_S037]

clumi_methodology: "calculations"
clumi_source_ids: ["S037"]
clumi_answer_values:
  total_members: 8500
  core_segment_35_44: 2884       # 35-39 (1429) + 40-44 (1455)
  buckets:                       # methodology 정답표
    "40-44": 1455
    "35-39": 1429
    "30-34": 1407
    "25-29": 1393
    "50-54": 800
    "45-49": 778
    "20-24": 477
    "60-64": 254
    "55-59": 241
    "15-19": 182
    # 65+ (기타) = 84

storage:
  layer: "computed"
  key_template: "S037_age_segment.json"   # period 없음 (전체)
  partition: []
  cache_ttl_sec: 0
