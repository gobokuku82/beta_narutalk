name: age_segment
description: "연령대 5세 bucket 분포 (S037) — customers.age FLOOR(/5)*5. methodology §S037"
version: "0.1.0"
category: metrics

parameters: []  # 전체 customers — period 무관

timeout_sec: 30
max_retries: 0
