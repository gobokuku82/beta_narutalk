name: roas_overall
description: "전체 ROAS (S004) — 총매출 / 총마케팅비. methodology §S004"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - roas                       # float — 비율 (2자리 반올림)
  - total_revenue              # int
  - total_marketing_cost       # int

has_cost: false
estimated_cost: 0.0

tags: [clumi, metrics, roas, methodology_S004]

clumi_methodology: "calculations"
clumi_source_ids: ["S004"]
clumi_answer_values:
  "2026-04":
    roas: 4.46   # 가 결정 A-5.2: google 포함 re-baseline (6.53 → 4.46)
    total_revenue: 119539660
    total_marketing_cost: 26806923

storage:
  layer: "computed"
  key_template: "S004_roas_overall_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
