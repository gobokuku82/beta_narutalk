name: aov_monthly
description: "월별 객단가·구매자수·주문수 (S048) — orders 활성 기반. methodology_calculations §S048"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM (단월). orders.order_date prefix"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - aov                  # int — 객단가 (KRW)
  - unique_buyers        # int — 구매 회원 수 (distinct member_id, 회원만)
  - orders_count         # int — 활성 주문 수

has_cost: false
estimated_cost: 0.0

tags: [clumi, metrics, aov, methodology_S048]

clumi_methodology: "calculations"
clumi_source_ids: ["S048"]
clumi_answer_values:
  "2026-04":
    aov: 62293
    unique_buyers: 1386
    orders_count: 1919

storage:
  layer: "computed"
  key_template: "S048_aov_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
