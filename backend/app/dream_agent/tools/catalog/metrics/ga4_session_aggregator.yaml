name: ga4_session_aggregator
description: "GA4 #07 세션 단위 집계 (정제 6) — session_start 카운트·event 분포·채널별 분포. methodology_cleaning §정제 6"
version: "0.1.0"
category: metrics

parameters: []  # POC: 전체 #07 (mock 단일 월)

timeout_sec: 60  # GA4 96MB streaming
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - session_start_total          # int — session_start 이벤트 수 (S067 분모)
  - by_source                    # dict[str, int] — 채널별 session_start
  - by_event                     # dict[str, int] — event_name 분포

has_cost: false
estimated_cost: 0.0

tags: [preprocessing, ga4, methodology_cleaning_6]

clumi_methodology: "cleaning"
clumi_methodology_rule: 6
clumi_source_ids: ["S034", "S065", "S066", "S067"]   # 정제 6 의 필요 산출물
clumi_answer_values:
  session_start_total: 24000
  by_event:
    session_start: 24000
    first_visit: 12496
    purchase: 1823

storage:
  layer: "normalized"
  key_template: "ga4_sessions_summary.json"
  partition: []
  cache_ttl_sec: 0
