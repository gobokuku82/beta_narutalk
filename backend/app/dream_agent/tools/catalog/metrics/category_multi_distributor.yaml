name: category_multi_distributor
description: "상품 카테고리 다중 분배 (정제 7) — orders.product_categories 콤마 분리 + 매출 균등 분배. methodology §정제 7 옵션 A"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: false
    description: "YYYY-MM (선택). 누락 시 전체"
  - name: method
    type: string
    required: false
    default: "equal"
    description: "분배 방법: 'equal' (균등, 옵션 A). 'category_sales' (옵션 B, #12 사용 — POC 미구현)"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - by_category                 # dict[str, {count, revenue}]
  - total_categories
  - total_distributed_revenue   # int — 분배 합 (총매출과 다를 수 있음)

has_cost: false
estimated_cost: 0.0

tags: [preprocessing, category, methodology_cleaning_7]

clumi_methodology: "cleaning"
clumi_methodology_rule: 7
clumi_answer_values:
  "2026-04":
    by_category:
      스킨케어: { count: 1400, revenue: 67652216 }
      클렌징: { count: 497, revenue: 19126163 }
      마스크팩: { count: 464, revenue: 19366323 }
      자외선차단: { count: 161, revenue: 6864031 }
      기타: { count: 166, revenue: 6530924 }

storage:
  layer: "normalized"
  key_template: "category_distributed_{period_safe}.json"
  partition: ["period"]
  cache_ttl_sec: 0
