name: ad_cost_total
description: "광고비 5매체 합산 (정제 5) — Meta·NaverSA·ADVoost·Kakao·Talktalk 의 cost 통일 합. methodology_cleaning §정제 5"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: false
    description: "YYYY-MM (Meta·NaverSA·ADVoost 의 date 필터). 누락 시 전체 (mock 은 4월만)"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - total_cost                  # int — 5매체 합 (KRW)
  - by_channel                  # dict[str, int] — 매체별 cost (meta·naver_sa·advoost·kakao·talktalk)
  # period 는 artifact 아님 (슬라이스 1, 2026-06-12) — 스코프 param 은 쿼리에서만. 'all' 라벨 방출 폐지.

has_cost: false
estimated_cost: 0.0

tags: [preprocessing, ad_cost, methodology_cleaning_5]

clumi_methodology: "cleaning"
clumi_methodology_rule: 5
clumi_source_ids: ["S003"]   # 마케팅비 = S003
clumi_answer_values:
  "2026-04":
    total_cost: 26806923   # 가 결정 A-5.2: google 포함 re-baseline (18,306,923 → 26,806,923)
    by_channel:
      meta: 9235826
      naver_sa: 5999627
      advoost: 3000000
      google: 8500000
      kakao: 59020
      talktalk: 12450

storage:
  layer: "normalized"
  key_template: "ad_cost_total_{period_safe}.json"
  partition: ["period"]
  cache_ttl_sec: 0
