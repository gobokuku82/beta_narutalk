name: unknown_revenue_share
description: "알수없음 채널 매출 비중 (S054) — channel_attribution='unknown' 매출 / 총매출. methodology §S054"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM (단월). orders.order_date prefix"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - unknown_share_pct          # float — 알수없음 매출 비중 (%)
  - unknown_revenue            # int — 알수없음 매출 (KRW)
  - total_revenue              # int — 총 매출 (KRW)
  - unknown_orders             # int — 알수없음 주문 수

has_cost: false
estimated_cost: 0.0

tags: [clumi, metrics, channel, methodology_S054]

clumi_methodology: "calculations"
clumi_source_ids: ["S054"]
clumi_answer_values:
  "2026-04":
    unknown_share_pct: 39.8
    unknown_revenue: 47539330
    total_revenue: 119539660

storage:
  layer: "computed"
  key_template: "S054_unknown_share_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
