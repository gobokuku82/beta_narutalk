name: signup_conversion
description: "가입 전환율 (S067) — 신규회원 / 방문세션 × 100. methodology §S067"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM (signup 분자 적용 — GA4 분모는 mock 단일 월이라 동일)"

timeout_sec: 60
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - signup_conversion_pct       # float (2자리)
  - signups                     # int — 신규 회원 (분자)
  - sessions                    # int — session_start (분모)

has_cost: false
estimated_cost: 0.0

tags: [clumi, metrics, conversion, ga4, methodology_S067]

clumi_methodology: "calculations"
clumi_source_ids: ["S067"]
clumi_answer_values:
  "2026-04":
    signup_conversion_pct: 2.50
    signups: 600
    sessions: 24000

storage:
  layer: "computed"
  key_template: "S067_signup_conversion_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
