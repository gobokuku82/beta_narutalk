name: cac_overall
description: "전체 CAC (S032) — 총마케팅비 ÷ 신규회원수. methodology §S032"
version: "0.1.0"
category: metrics

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - cac                        # int — KRW
  - total_marketing_cost       # int
  - new_members_count          # int

has_cost: false
estimated_cost: 0.0

tags: [clumi, metrics, cac, methodology_S032]

clumi_methodology: "calculations"
clumi_source_ids: ["S032"]
clumi_answer_values:
  "2026-04":
    cac: 44678   # 가 결정 A-5.2: google 포함 re-baseline (30,512 → 44,678 = 26,806,923 / 600)
    total_marketing_cost: 26806923
    new_members_count: 600

storage:
  layer: "computed"
  key_template: "S032_cac_overall_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
