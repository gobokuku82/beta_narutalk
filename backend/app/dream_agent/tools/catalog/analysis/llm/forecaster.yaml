name: forecaster
description: "LLM 예측 — 과거 추세에서 향후 전망 추정 (불확실성 명시)"
version: "0.1.0"
category: analysis

parameters:
  - name: max_items
    type: integer
    required: false
    default: 3

timeout_sec: 60
max_retries: 2
requires_approval: false

produces:
  - forecast

has_cost: true
estimated_cost: 0.01

tags: [analysis, llm, forecast]
