name: keyword_extractor
description: "빈도 기반 키워드 추출 (POC: Counter, MVP: TF-IDF/KeyBERT)"
version: "0.1.0"
category: analysis

parameters:
  - name: top_k
    type: integer
    required: false
    default: 10
  - name: min_chars
    type: integer
    required: false
    default: 2

timeout_sec: 30
max_retries: 1
requires_approval: false

dependencies:
  - text_preprocessor

produces:
  - top_keywords

has_cost: false
estimated_cost: 0.0

tags: [analysis, ml, keywords]
