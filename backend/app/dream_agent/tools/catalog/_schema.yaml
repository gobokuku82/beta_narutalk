# ============================================================
# Tool Definition Schema (V2)
# ============================================================
#
# 이 파일은 Tool YAML 정의의 스키마 가이드입니다.
# 모든 tool YAML 파일은 이 구조를 따라야 합니다.
#
# ToolRegistry가 이 폴더의 모든 *.yaml 파일을 자동 로드합니다.
# (_schema.yaml, _example.yaml 등 언더스코어 시작 파일은 제외)
#
# ============================================================

# --- 필수 필드 ---

name: string                    # 도구 고유 식별자 (영문, snake_case)
description: string             # 도구 설명 (LLM이 Plan 생성 시 참조)
version: string                 # 시맨틱 버전 (예: "1.0.0")

# 도구 분류
category: string                # 실행 카테고리 — open-vocab (2026-07-02): 검증된 자유 문자열(non-empty).
                                #   폐쇄 집합 아님 — 도메인 고유 어휘도 그대로 등록·로드된다(미지 값 = debug 로그만).
                                #   관례값(권장, models/enums.py KNOWN_TOOL_CATEGORIES):
                                #     collection | normalization | cleaning | preprocessing | metrics |
                                #     comparison | analysis | report | rendering | qa | decision

# Executor 매핑
executor: string                # 실행할 Executor 클래스 경로
                                # 예: "executors.data_executor.DataExecutor"

# --- 파라미터 정의 ---

parameters:                     # LLM이 Plan 생성 시 이 정보를 참조하여 todo.params 생성
  - name: string                # 파라미터 이름
    type: string                # 타입: string | integer | float | boolean | array | object
    required: boolean           # 필수 여부
    default: any                # 기본값 (optional)
    description: string         # 설명 (LLM 참조용)
    enum: [string]              # 허용 값 목록 (optional)

# --- 실행 설정 ---

timeout_sec: integer            # 타임아웃 (초, 기본: 120)
max_retries: integer            # 최대 재시도 (기본: 3)
requires_approval: boolean      # HITL 승인 필요 여부 (기본: false)

# --- 의존성 & 산출물 ---

dependencies: [string]          # 선행 필요 도구 이름 (DAG 구성에 사용)
produces: [string]              # 산출물 키 (다음 도구가 참조 가능)

# --- 표시 메타 (2026-07-02 — Response 레이어 디스패치. 미선언 = 표시 비활성/일반 렌더) ---
# 이 도구의 produces 키가 응답에서 '어떻게' 보이는지 선언. responder·_generate_summary 가 소비.
# 미선언 시 honest floor(_render_metrics 일반 스칼라)만 렌더 — 새 도메인 도구는 여기 선언 권장.
display:
  narrative_keys: [string]      # 서술형 산출 키(report/answer 류). 순서 = 표시 우선순위
  insight_keys:   [string]      # list[{title, description}] 인사이트 산출 키
  table_key:      string        # list[dict] 표(행) 산출 키
  attachment:                   # 파일 산출 → 첨부. multi=true 면 그 키가 경로 list
    - {key: string, kind: string, multi: boolean}
  summary_template: string      # UI 1줄 요약. data 키를 {name} 으로 치환(누락 키='?')
  infra: boolean                # true = 인프라 도구(구 'collector' 규약) — 산출 판정/skip 고지서 제외

# --- 비용 ---

has_cost: boolean               # 외부 API 비용 발생 여부
estimated_cost: float           # 예상 비용 (USD, 1회 실행 기준)

# --- 메타데이터 ---

tags: [string]                  # 검색/필터용 태그
enabled: boolean                # 활성화 여부 (기본: true)

# --- 예시 (LLM few-shot용) ---

examples:
  - input: object               # 입력 예시
    output: object              # 출력 예시
    description: string         # 예시 설명 (optional)
