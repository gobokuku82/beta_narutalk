name: chart_generator
description: "분석 산출(by_채널/분포·rows)을 차트 PNG로 렌더링 — matplotlib, 한국어 폰트, Warm Neutral 팔레트"
version: "0.1.0"
category: rendering

parameters:
  - name: output_dir
    type: string
    required: false
    description: "출력 디렉토리 (미지정 시 data/{client}/outputs/charts)"

timeout_sec: 60
max_retries: 0
requires_approval: false

dependencies: []

produces:
  - chart_image_paths   # list[str] — PNG 경로 (responder chart attachment + pptx_generator 선택 소비)

tags: [output, chart, render]
