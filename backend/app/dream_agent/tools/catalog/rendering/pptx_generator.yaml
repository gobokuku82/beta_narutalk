name: pptx_generator
description: "마크다운 보고서를 PPT 슬라이드로 생성 (python-pptx)"
version: "0.1.0"
category: rendering

parameters:
  - name: output_dir
    type: string
    required: false
    description: "출력 디렉토리 (미지정 시 data/{client}/outputs)"

timeout_sec: 60
max_retries: 2
requires_approval: false

dependencies:
  - report_writer

produces:
  - pptx_file_path

tags: [rendering, ppt, slides]
