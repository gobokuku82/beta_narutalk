name: pdf_renderer
description: "마크다운 보고서를 PDF로 렌더링 (reportlab, 한국어 CID 폰트)"
version: "0.1.0"
category: rendering

parameters:
  - name: output_dir
    type: string
    required: false
    description: "출력 디렉토리 (미지정 시 data/{client}/outputs)"

timeout_sec: 60
max_retries: 2
requires_approval: false

dependencies:
  - report_writer

produces:
  - pdf_file_path

tags: [output, pdf, render]
