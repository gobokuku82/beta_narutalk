name: member_metrics_validator
description: "회원 누적 지표 정합 검증 (정제 3) — customers.total_orders/total_purchase_amount/last_order_date 가 실제 orders 활성주문과 일치하는지 검증. 불일치 시 orders 기반 재계산값 반환. C:LUMI methodology_cleaning §정제 3"
version: "0.1.0"
category: cleaning

parameters:
  - name: fields
    type: array
    required: false
    default: ["total_orders", "total_purchase_amount", "last_order_date"]
    description: "검증할 customers 컬럼 (default = methodology 명시 3종). 일부만 선택 가능"
  - name: include_lifetime
    type: boolean
    required: false
    default: false
    description: "customers 의 last_order_date 가 orders 데이터 범위(3-4월) 외 평생값을 포함할 수 있는지. true=불일치 허용 / false=엄격 비교. POC mock 은 정합이라 false"

timeout_sec: 60
max_retries: 0
requires_approval: false

dependencies: []  # POC: clumi_loader 직접 (file_no=5, 6)
produces:
  - validated_customers     # list[dict] — orders 기반 재계산 후 보정된 회원 records
  - mismatches              # list[dict] — 불일치 회원 {member_id, field, customer_value, actual_value}
  - mismatch_count          # int — 불일치 회원 수 (mock 정합 기대 = 0)
  - customer_count          # int — 전체 회원 수
  - active_orders_member    # int — 활성주문 (회원만) 수

has_cost: false
estimated_cost: 0.0

tags: [cleaning, customers, validation, methodology_3]

# C:LUMI 메타
clumi_methodology: "cleaning"
clumi_methodology_rule: 3
clumi_answer_values:
  customer_count: 8500
  active_orders_member: 3007
  mismatch_count: 0    # mock 정합 — methodology §정제 3 "이미 3월 추가 후 갱신"

# 저장 정책
storage:
  layer: "normalized"
  key_template: "customers_validated.parquet"
  partition: []
  cache_ttl_sec: 0
