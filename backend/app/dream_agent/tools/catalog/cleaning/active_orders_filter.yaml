name: active_orders_filter
description: "활성 주문 필터링 (정제 1) — order_status != 'C40' 인 행만 유지. C:LUMI methodology_cleaning §정제 1"
version: "0.1.0"
category: cleaning

parameters:
  - name: period
    type: string
    required: true
    description: "YYYY-MM (단월, 예: '2026-04') 또는 YYYY-MM/YYYY-MM (구간, 예: '2026-03/2026-04'). order_date 기준 prefix 매치"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []  # POC: clumi_loader 직접 호출. collection/clumi/ 진입 시 의존성 추가
produces:
  - orders_active        # list[dict] — 활성 주문 records
  - count                # int — 활성 주문 수
  - dropped              # int — 제외된 (취소) 행 수

has_cost: false
estimated_cost: 0.0

tags: [cleaning, orders, methodology_1]

# C:LUMI 추가 메타 (catalog 표준 확장 — 본 tool 이 패턴 1차)
clumi_methodology: "cleaning"
clumi_methodology_rule: 1
clumi_answer_values:
  "2026-04": 1919          # methodology 정답값 — 회귀 테스트가 검증
  "2026-03/2026-04": 3265

# 저장 정책 (StorageBackend 연동)
storage:
  layer: "normalized"
  key_template: "orders_active_{period_safe}.parquet"  # period 의 / → _ 변환은 tool 내부
  partition: ["period"]
  cache_ttl_sec: 0  # POC: 캐시 안 함 (재실행 검증 우선)
