name: channel_cac_compare
description: "채널별 CAC (S033) — 채널별 마케팅비 ÷ 신규회원. 명확 cost 채널만 CAC, 분리 어려운 매체는 unmatched 명시. methodology §S033"
version: "0.1.0"
category: comparison

parameters:
  - name: period
    type: string
    required: true

timeout_sec: 60
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - by_channel                  # dict[ch, {cost, new_members, cac}]
  - weighted_avg_cac            # int — 전체 CAC (= S032)
  - unmatched_channels          # list — 매칭 어려운 채널 (advoost, talktalk 등)

has_cost: false
estimated_cost: 0.0

tags: [clumi, comparison, cac, channel, methodology_S033]

clumi_methodology: "calculations"
clumi_source_ids: ["S033"]
clumi_answer_values:
  "2026-04":
    weighted_avg_cac: 44678   # 가 결정 A-5.2: google 포함 re-baseline (30,512 → 44,678 = 26,806,923 / 600)
    kakao_cac: 2270           # 정확 (59,020 / 26) — kakao 비용 불변
    new_members_total: 600

storage:
  layer: "computed"
  key_template: "S033_channel_cac_{period}.json"
  partition: ["period"]
  cache_ttl_sec: 0
