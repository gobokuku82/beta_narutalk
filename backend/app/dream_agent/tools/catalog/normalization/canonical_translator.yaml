name: canonical_translator
description: "contract-driven canonical translator — raw 5채널 → normalized canonical measures + computed metrics(MER) + lineage. 하드코딩 normalizer(ad_cost_helper 등) 흡수. 피봇 §3.2 REPLACE 심장. (P2 격리: 5채널·핵심measure, google·measure16·aMER=후속)"
version: "0.1.0"
category: normalization

parameters:
  - name: period
    type: string
    required: false
    description: "YYYY-MM (기본 2026-04). meta/naver/advoost/orders 에 적용. kakao/talktalk=summary 단위(기간무관)"

timeout_sec: 60
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - normalized                  # {channel: {measures, rows}} — canonical measures
  - computed                    # {total_marketing_cost_krw, mer, channel_roas_x, ...} — 파생 재계산
  - lineage                     # [{channel, canonical, source, value, transform}] — 신뢰·감사

has_cost: false
estimated_cost: 0.0

tags: [clumi, normalization, canonical, pivot, contract_driven]

clumi_methodology: "normalization"
clumi_answer_values:
  "2026-04":
    total_marketing_cost_krw: 26806923   # ad 26,735,453 + msg 71,470 (가 결정 A-5.2: google 포함 re-baseline)
    mer: 4.46                            # order_revenue / total_marketing_cost (google 포함)
    ad_cost_by_channel:
      meta: 9235826
      naver_sa: 5999627
      advoost: 3000000
      google: 8500000

storage:
  layer: "normalized"                       # P1 에서 'normalized' rename 시 동반 갱신
  key_template: "canonical_normalized_{period_safe}.json"
  partition: ["period"]
  cache_ttl_sec: 0
