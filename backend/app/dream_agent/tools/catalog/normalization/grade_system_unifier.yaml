name: grade_system_unifier
description: "등급 체계 통일 (정제 8) — #06 표준 (WELCOME~VIP) + #10 customer_tier 매핑. methodology §정제 8"
version: "0.1.0"
category: normalization

parameters: []

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - standard_grade_dist         # dict[str, int] — #06 WELCOME~VIP 분포
  - tier_dist                   # dict[str, int] — #10 customer_tier 분포 (RFM 용)
  - consistency_check           # bool — #06 ↔ #21 last snapshot 일치 여부

has_cost: false
estimated_cost: 0.0

tags: [clumi, normalization, grade, methodology_cleaning_8]

clumi_methodology: "cleaning"
clumi_methodology_rule: 8
clumi_answer_values:
  standard_grade_dist:
    WELCOME: 6333
    REGULAR: 1539
    SILVER: 600
    GOLD: 28
    VIP: 0

storage:
  layer: "normalized"
  key_template: "grade_unified.json"
  partition: []
  cache_ttl_sec: 0
