name: channel_attribution_normalizer
description: "채널 정규화 + 그룹 매핑 (정제 4) — orders.channel_attribution 10채널 → 그룹 (Meta·Naver검색계·CRM·Direct·etc). methodology §정제 4"
version: "0.1.0"
category: normalization

parameters:
  - name: period
    type: string
    required: false
    description: "YYYY-MM (선택). 누락 시 전체"

timeout_sec: 30
max_retries: 0
requires_approval: false

dependencies: []
produces:
  - by_raw_channel              # dict[str, int] — 원본 값 분포
  - by_group                    # dict[str, int] — 그룹 단위 분포
  - mapping                     # dict[str, str] — raw → group

has_cost: false
estimated_cost: 0.0

tags: [clumi, normalization, channel, methodology_cleaning_4]

clumi_methodology: "cleaning"
clumi_methodology_rule: 4
clumi_answer_values:
  "2026-04":
    by_raw_channel_top:
      unknown: 481
      naver_search: 283
      meta_instagram: 253

storage:
  layer: "normalized"
  key_template: "channel_normalized_{period_safe}.json"
  partition: ["period"]
  cache_ttl_sec: 0
