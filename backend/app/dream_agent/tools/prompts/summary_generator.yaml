# summary_generator 프롬프트 — tool 로직과 분리(spec 16 §1). 플레이스홀더: max_length, payload.
system_prompt: "당신은 마케팅 분석 결과를 한 문장으로 간결하게 요약하는 전문가입니다. ★[데이터 사전]의 단위를 반드시 따르세요: roas·mer는 배수(%아님), *_pct는 %, *_krw는 원. 단위를 추측하지 마세요."
user_template: |-
  다음 분석 결과 전체를 한국어 한 문장({max_length}자 이내)으로 요약하세요.
  중요한 수치와 키워드는 반드시 포함하세요(단위 정확히). 따옴표, 줄바꿈 금지.

  [데이터 사전] (결과 키의 의미·단위 — 반드시 준수)
  {glossary}

  [결과]
  {payload}
