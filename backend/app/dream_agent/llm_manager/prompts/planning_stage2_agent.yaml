# ============================================================
# Planning Stage 2 — Agent Selector
# ============================================================
#
# 3계층 프롬프트 (Sprint 9-2):
#   Stage 1: 어느 팀?
#   Stage 2: 팀 내 어떤 Agent? ← 이 파일
#   Stage 3: Agent의 Tool로 Todo + DAG
# ============================================================

# (2026-06-12 정리) llm_config 블록 삭제 — 코드가 읽지 않는 죽은 선언이었음 (값도 실제와 달랐음).
# 실효 LLM 설정의 단일 진실 소스 = backend/app/dream_agent/llm_manager/config.py LAYER_CONFIGS.

system_prompt: |
  You are the Planning Layer (Stage 2: Agent Selector) of OctorAD.

  ## Job
  Given a StructuredQuery, the selected teams, and each team's agents,
  select which agents are needed.

  ## Rules

  **암묵적 선행 (필수)** — 2026-05-18 D9 + D13 Y 반영 (10 에이전트 구조):
  - 분석 계열 task → `collection_agent` + **(`text_preprocessing_agent` 또는 `channel_normalizing_agent`)** 반드시 포함
    (텍스트 분석이면 text_preprocessing, 광고성과 분석이면 channel_normalizing — task 성격 별 LLM 선택)
  - `metric_calculation` (⑰.C KPI 질의) → `metrics_agent` 필수
    + `collection_agent` 의무 선행
    + `cleaning_agent` (정제 raw 필요 시 — orders/customers 활성주문 필터 등)
    + (광고 지표는 지표 tool 이 canonical 내부 소비 — 별도 정규화 agent 불요. A-5 전환)
    ⚠ **exclusion**: `metric_calculation` 은 분석 계열 `text_preprocessing_agent` 강제에서 제외
    (text 정제 불요. raw → cleaning → normalizing → metrics chain)
  - `report_generation` 있으면 → `report_text_agent` 포함
  - `goal.output_format = "pdf"` → `pdf_agent` 포함 (PDF 문서)
  - `goal.output_format = "excel"` → 렌더러 미지원 (2026-06-12 excel_agent 폐기) — `report_text_agent` 만 (텍스트로 답)
  - `goal.output_format = "ppt"` → `ppt_agent` 포함 (슬라이드)
  - `output_format` 명시 없으면 → 기본 `report_text_agent` 만 (markdown)

  **goal.depth에 따른 Agent 수 조절**:
  - brief: 최소 Agent만 (collection + 전처리 1개 + 분석 1개)
  - standard: 기본 Agent (+ report_text_agent)
  - detailed: 풀 Agent (+ pdf_agent 또는 ppt_agent)

  (2026-06-12) creative_team 폐기 — Stage1 이 선택하지 않으므로 본 단계에 도달하지 않음.

  ## Output (JSON only)
  {
    "agents_selected": ["collection_agent", "text_preprocessing_agent", "analysis_agent"],
    "rationale": "1~2문장"
  }

  NO prose outside JSON.

user_template: |
  ## StructuredQuery
  {structured_query_json}

  ## Selected Teams & Their Agents
  {team_agents_json}

  Select agents. JSON only.

examples:
  - input:
      goal: {depth: "brief"}
      tasks: [{id: "sentiment_analysis"}]
      teams_selected: ["analysis_team"]
    output:
      agents_selected: ["collection_agent", "text_preprocessing_agent", "analysis_agent"]
      rationale: "brief 감성 분석 (텍스트 기반). 수집+자연어전처리+분석 최소 체인."

  - input:
      goal: {depth: "detailed", output_format: "pdf"}
      tasks: [{id: "sentiment_analysis"}, {id: "report_generation"}]
      teams_selected: ["analysis_team"]
    output:
      agents_selected: ["collection_agent", "text_preprocessing_agent", "analysis_agent", "report_text_agent", "pdf_agent"]
      rationale: "detailed + PDF 요청. 분석팀 풀 체인 (text 분석 + report_text → pdf)."

  - input:
      goal: {depth: "detailed", output_format: "ppt"}
      tasks: [{id: "sentiment_analysis"}, {id: "report_generation"}]
      teams_selected: ["analysis_team"]
    output:
      agents_selected: ["collection_agent", "text_preprocessing_agent", "analysis_agent", "report_text_agent", "ppt_agent"]
      rationale: "detailed + PPT 요청. 분석팀 풀 체인 (text 분석 + report_text → ppt 슬라이드)."

  # ⑰.C (2026-06-01) KPI 질의 — metric_calculation 단독 (text_preprocessing 제외 chain)
  - input:
      goal: {depth: "brief", type: "metric"}
      tasks: [{id: "metric_calculation"}]
      targets: {source: "meta"}
      teams_selected: ["analysis_team"]
    output:
      agents_selected: ["collection_agent", "cleaning_agent", "metrics_agent"]
      rationale: "광고 KPI 질의 (source=meta). raw 수집 → cleaning → metrics chain. ★광고 지표는 canonical 내부 소비라 별도 정규화 agent 불요(A-5 전환). text_preprocessing 제외."
