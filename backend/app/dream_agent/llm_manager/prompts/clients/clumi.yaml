# ============================================================
# Client Cognitive Profile — C:LUMI (클루미)
# ============================================================
#
# 공용 cognitive.yaml 에 *주입*되는 회사별 지식.
# 회사마다 다른 시스템 = clients/{client}.yaml 한 장 추가 (코드 무변경).
#
# Status: partial — A1 (2026-06-04): 프로필 콘텐츠 정의 완료.
#   A3 에서 cognitive_stage 가 state["client_id"] 로 로드·주입하도록 배선 예정.
#   내용 출처 = data/clumi/description/README.md (사실, 추측 0).
#
# 분리 원칙:
#   - 공용(cognitive.yaml): JOB·스키마·depth/ambiguity 규칙·응답형식·도메인일반 은어
#   - 프로필(이 파일): 이 회사의 brand·sources·KPI 어휘·brand특정 은어·도메인 few-shot
# ============================================================

client_id: clumi

# ─── 브랜드 컨텍스트 (targets.brand 추출 + 전반 grounding) ───
brand_context: |
  - 브랜드: C:LUMI (클루미) — Clean·Bright 콘셉트 스킨케어
  - 사업모델: D2C 자사몰 (Cafe24) + 네이버 스마트스토어
  - 타겟: 25-44세 여성 (핵심 35-44세)
  - 브랜드 표기 변형: "클루미" = "C:LUMI" = "CLUMI" (동일 브랜드)

# ─── 보유 데이터 소스 (targets.source 추론 참고 — 반드시 Source enum 값) ───
# ⚠ PMAL(Phase B): source 는 cognitive 출력에서 제거되고 planning 이 바인딩.
#    그 시점에 이 블록은 planning 의 client 카탈로그로 이동한다.
# ⚠ 리뷰 분석은 source 가 아니라 *task*(sentiment_analysis/keyword_extraction)로 신호.
#    source 는 unknown 으로 두면 planning 이 review_collector default 적용 (현 컨벤션).
available_sources:
  - {id: meta,           desc: "Meta 광고 성과 (캠페인·연령·인스타 인앱)"}
  - {id: naver,          desc: "네이버 검색광고·ADVoost·톡톡·관심알림"}
  - {id: kakao,          desc: "카카오 비즈메시지"}
  - {id: ga4,            desc: "GA4 트래픽 소스·페이지 이벤트 (웹 행동)"}
  - {id: orders,         desc: "자사몰 주문 (Cafe24) — 매출의 진실 소스"}
  - {id: customers,      desc: "회원 마스터·RFM·가입이벤트·등급이력"}
  - {id: promotions,     desc: "프로모션 5종·광고변경이력"}
  - {id: category_sales, desc: "카테고리별 일별 매출"}
  - {id: crm,            desc: "CRM 메시지 A/B"}

# ─── KPI 어휘 (이 용어 → metric_calculation 신호) ───
metric_glossary:
  - {term: "ROAS",   def: "광고수익률 = 광고매출 / 광고비 (clumi 4월 4.46 — google 포함 A-5.2)"}
  - {term: "CAC",    def: "고객획득비용 = 광고비 / 신규회원 (clumi 4월 44,678원 — google 포함 A-5.2)"}
  - {term: "CTR",    def: "클릭율 = clicks / impressions"}
  - {term: "CPC",    def: "클릭당 비용 = spend / clicks"}
  - {term: "CPM",    def: "1000노출당 비용 = spend / impressions × 1000"}
  - {term: "CVR",    def: "전환율 = conversions / clicks"}
  - {term: "LTV",    def: "고객 생애가치 (RFM predicted_clv)"}
  - {term: "재구매율", def: "total_orders >= 2 회원 비율 (clumi 4월 79.0%)"}
  - {term: "AOV",    def: "객단가 = 매출 / 주문수"}
  - {term: "매출/광고비/신규회원/전환수", def: "기본 수치 질의"}

# ─── 프로모션 (extra_filters / keywords 매칭 참고) ───
promotions: ["SPRING_SERUM_1+1", "MASK_5+2", "NEWSET_30OFF", "WELCOME_20", "FRIEND_5000"]

# ─── 브랜드 특정 은어 정규화 ───
# (도메인 일반 은어 — "ROAS 터졌어" 등 — 는 공용 cognitive.yaml 책임.
#  여기는 clumi 고유 표현만. README 에 문서화된 고유 은어 없음 → 비움.
#  사용자 도메인 입력 누적 시 채운다. [[project_llm_heavy_initial]])
brand_slang_map: []

# ─── 도메인 few-shot (PMAL intent 시범 — W3) ───
# ★ intent 가 핵심: 주제를 domain 한 칸에 결정적으로 담는다. tasks 는 intent 에서 자동 파생(런타임 shim)이라
#   여기 tasks 는 *참고용 일관 표시*. operation×domain 공간 커버 (measure/breakdown/diagnose × ad/revenue/customers/reviews).
few_shot:
  # 1) 수치 조회 (measure · ad_performance)
  - input: "4월 ROAS 알려줘"
    output:
      targets: {brand: "C:LUMI", product: null, competitors: [], source: "meta", period: {raw: "4월", window: "2026-04"}, keywords: ["ROAS"], extra_filters: {}}
      goal: {type: "metric", output_format: "text", depth: "brief", audience: null}
      intent: {operation: "measure", domain: ["ad_performance"], metric: ["ROAS"], dimensions: []}
      tasks: [{id: "metric_calculation", priority: 1, params_override: {kpi: "roas"}}]
      meta: {confidence: 0.93, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "4월 ROAS 알려줘", cleaned: "2026년 4월 전체 ROAS 수치를 조회해 알려달라.", language: "ko"}

  # 2) 매출 (measure · revenue)
  - input: "4월에 우리 매출 얼마나 나왔어?"
    output:
      targets: {brand: "C:LUMI", product: null, competitors: [], source: "orders", period: {raw: "4월", window: "2026-04"}, keywords: ["매출"], extra_filters: {}}
      goal: {type: "metric", output_format: "text", depth: "brief", audience: null}
      intent: {operation: "measure", domain: ["revenue"], metric: ["revenue"], dimensions: []}
      tasks: [{id: "metric_calculation", priority: 1, params_override: {kpi: "revenue"}}]
      meta: {confidence: 0.92, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "4월에 우리 매출 얼마나 나왔어?", cleaned: "2026년 4월 C:LUMI 총 매출 금액을 조회.", language: "ko"}

  # 3) 리뷰 감성 (measure · reviews) — domain=reviews 가 텍스트 분석 신호
  - input: "클루미 리뷰 반응 어때?"
    output:
      targets: {brand: "C:LUMI", product: null, competitors: [], source: "unknown", period: null, keywords: [], extra_filters: {}}
      goal: {type: "answer", output_format: "text", depth: "brief", audience: null}
      intent: {operation: "measure", domain: ["reviews"], metric: [], dimensions: []}
      tasks: [{id: "sentiment_analysis", priority: 1, params_override: {}}]
      meta: {confidence: 0.90, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "클루미 리뷰 반응 어때?", cleaned: "C:LUMI 리뷰의 전반적 감성 반응(긍/부정)을 알고 싶음.", language: "ko"}

  # 4) 회원 수치 (measure · customers)
  - input: "4월 신규 회원 몇 명이야?"
    output:
      targets: {brand: "C:LUMI", product: null, competitors: [], source: "customers", period: {raw: "4월", window: "2026-04"}, keywords: ["신규 회원"], extra_filters: {}}
      goal: {type: "metric", output_format: "text", depth: "brief", audience: null}
      intent: {operation: "measure", domain: ["customers"], metric: ["new_members"], dimensions: []}
      tasks: [{id: "metric_calculation", priority: 1, params_override: {kpi: "new_members"}}]
      meta: {confidence: 0.91, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "4월 신규 회원 몇 명이야?", cleaned: "2026년 4월 신규 가입 회원 수를 조회.", language: "ko"}

  # 5) 차원 분해 (breakdown · dimensions) — "~별로"
  - input: "4월 채널별로 광고비 어떻게 나뉘어?"
    output:
      targets: {brand: "C:LUMI", product: null, competitors: [], source: "meta", period: {raw: "4월", window: "2026-04"}, keywords: ["광고비"], extra_filters: {}}
      goal: {type: "metric", output_format: "text", depth: "standard", audience: null}
      intent: {operation: "breakdown", domain: ["ad_performance"], metric: ["ad_cost"], dimensions: ["channel"]}
      tasks: [{id: "metric_calculation", priority: 1, params_override: {}}]
      meta: {confidence: 0.9, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "4월 채널별로 광고비 어떻게 나뉘어?", cleaned: "2026년 4월 광고비를 채널별로 분해해 분포를 보고 싶음.", language: "ko"}

  # 6) 인과 (diagnose) — "왜?". 인과 도구 부재 → tasks 비움(planning 이 정직 degrade, W5)
  - input: "지난달 CAC가 왜 올랐어?"
    output:
      targets: {brand: "C:LUMI", product: null, competitors: [], source: "meta", period: {raw: "지난달", window: null}, keywords: ["CAC"], extra_filters: {}}
      goal: {type: "insight", output_format: "text", depth: "standard", audience: null}
      intent: {operation: "diagnose", domain: ["ad_performance"], metric: ["CAC"], dimensions: []}
      tasks: []
      meta: {confidence: 0.82, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "지난달 CAC가 왜 올랐어?", cleaned: "지난달 CAC 상승의 원인을 진단하고 싶음 (수치가 아니라 why). ※원인분석 도구가 없으면 한계를 정직히 안내해야 함.", language: "ko"}

  # 7) 모호 — 대상/작업 불명 (domain 비움)
  - input: "분석해줘"
    output:
      targets: {brand: null, product: null, competitors: [], source: "unknown", period: null, keywords: [], extra_filters: {}}
      goal: {type: "answer", output_format: "text", depth: "standard", audience: null}
      intent: {operation: "measure", domain: [], metric: [], dimensions: []}
      tasks: []
      meta: {confidence: 0.40, ambiguity: {is_ambiguous: true, severity: "high", reasons: ["대상·작업 불명확"], clarification_question: "어떤 지표(매출/ROAS/회원 등)를 어느 기간으로 볼까요?"}, missing: ["target", "task_spec"], raw_input: "분석해줘", cleaned: "무엇을·어느 기간·어떤 지표를 분석할지 불명확 — 대상과 작업 확인 필요.", language: "ko"}

  # 8) 정의 질문 (factual) — 데이터 분석 아님 → domain 비움 → tasks=factual_lookup 유지
  - input: "ROAS가 뭐야?"
    output:
      targets: {brand: null, product: null, competitors: [], source: "unknown", period: null, keywords: ["ROAS"], extra_filters: {}}
      goal: {type: "answer", output_format: "text", depth: "brief", audience: null}
      intent: {operation: "measure", domain: [], metric: ["ROAS"], dimensions: []}
      tasks: [{id: "factual_lookup", priority: 1, params_override: {}}]
      meta: {confidence: 0.95, ambiguity: {is_ambiguous: false, severity: "none", reasons: [], clarification_question: null}, missing: [], raw_input: "ROAS가 뭐야?", cleaned: "ROAS 용어의 정의를 묻는 질문 (데이터 분석 아님).", language: "ko"}
