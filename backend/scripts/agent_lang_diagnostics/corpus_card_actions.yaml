# 카드→에이전트 메뉴 액션 라우팅 테스트 코퍼스 (2026-06-10)
# 목적: 팝업 메뉴 항목의 "문구 유도" 프롬프트가 맞는 operation→tool 로 라우팅되나 검증.
# 설계: docs/reports/카드클릭_에이전트연결_설계계획_2026-06-10.md §3
# 실행: cd backend && uv run python -m scripts.agent_lang_diagnostics.run_harness --corpus corpus_card_actions.yaml
client: clumi
queries:
  # 🔍 숫자나온방법 (기대: Q&A/measure — provenance op 부재 확인 = methodology_explainer 필요 근거)
  - q: "객단가 62,293원이 어떻게 계산된 거야?"
    type: provenance
    note: "🔍 숫자나온방법 — AOV"
  - q: "이 ROAS 389%는 무슨 데이터로 어떻게 나온 거야?"
    type: provenance
    note: "🔍 숫자나온방법 — ROAS"

  # ✅ 재검증 (기대: measure 재실행 → metric tool)
  - q: "이번 달 객단가를 재계산해서 62,293원이 맞는지 검증해줘"
    type: quantifier
    note: "✅ 재검증 — AOV"

  # 📊 분석·진단 (기대: diagnose → CAUSAL_ANALYSIS → diagnoser)
  - q: "네이버 채널 ROAS가 왜 이렇게 낮은지 분석해줘"
    type: diagnose
    note: "📊 진단 — 채널 ROAS"
  - q: "4월 매출이 전월 대비 왜 이렇게 변했는지 원인 분석해줘"
    type: diagnose
    note: "📊 진단 — 매출 MoM"

  # 📊 분석·예측 (기대: forecast → TREND_ANALYSIS → forecaster)
  - q: "이 ROAS 추세가 앞으로 어떻게 될지 예측해줘"
    type: forecast
    note: "📊 예측 — ROAS 추세"

  # 📊 분석·추론 (기대: attribute → INSIGHT_GENERATION → insight_extractor)
  - q: "이 전환 퍼널 단계별 이탈 결과가 무슨 의미인지 시사점 알려줘"
    type: attribute
    note: "📊 추론 — 퍼널 의미"

  # 💡 의사결정 (기대: recommend → RECOMMENDATION → recommender)
  - q: "노출 피로가 높은 이 소재를 어떻게 하면 좋을지 개선안 추천해줘"
    type: recommend
    note: "💡 의사결정 — 소재 교체"
  - q: "예산이 과소집행된 이 캠페인의 재배분안을 추천해줘"
    type: recommend
    note: "💡 의사결정 — 예산 재배분"
