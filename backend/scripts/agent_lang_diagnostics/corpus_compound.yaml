# 복합쿼리 처리 능력 측정 코퍼스 — 현 천장(ceiling) 진단 (2026-06-09)
#
# 목적: "지금 시스템이 복합쿼리를 어디까지 처리하나"를 등급별로 측정.
#       cognitive(의도 보존) + planning(todo·의존·DAG 형성)을 헤드리스로 돌려 등급별 깨짐 지점을 찾는다.
# 범위: 이전턴/대시보드 참조(cross-turn)는 미구현이라 제외 (사용자 2026-06-09 지시). 단일 쿼리 안(intra)만.
# 사용: python -m scripts.agent_lang_diagnostics.run_harness --corpus corpus_compound.yaml  (backend/ 에서)
#       python -m scripts.agent_lang_diagnostics.measure_stage1_coverage --corpus corpus_compound.yaml --runs 3 --judge
#
# 등급:
#   lv1 = 단일 의도 (baseline, 잘 돼야 함)
#   lv2 = 단순 나열 (독립 2개, 같은 결의 operation)
#   lv3 = 다의도 (서로 다른 operation 2~3개, 독립)
#   lv4 = 의존 체인 (A 결과를 B 가 소비 — "그걸로/그 결과로")
#   lv5 = fan-out + 다의도 + 의존 + 산출 (실제 lv5 복합)
# expect = 이상적으로 잡혀야 할 것(판정 기준). ops=요청된 operation들 / dep=의존 유무 / out=최종 산출.
#
# expect_display (T3, M0 2026-06-12) = ④단 표시 판정 기준 — 의도별 산출이 응답 표면
#   (text/summary/error/attachments)에 보이는가. any=하나라도 / all=전부 (결정론 keyword).
#   키워드 보정(T3-2 2026-06-12): 분해 렌더가 영문 데이터 키를 노출 → all 원소를 any-of 리스트로
#   (채널/channel 등). 쿼리 원문·구조는 불변 — 판정 어휘만 보정.
#   한계 박제: "X 는 실패했습니다(사유)" 정직 고지도 표출로 센다(G8 의 기대 — 부재의 침묵 금지).
#   거짓 서사 여부는 ③단 귀속(완주)과 교차해 읽는다. 쿼리 원문 14개는 2026-06-09 그대로 (기준선 비교성).

client: clumi

queries:
  # ── lv1 단일 (baseline) ──
  - q: "4월 ROAS 알려줘"
    type: compound_lv1
    expect: "ops=[measure] / dep=no / out=text"
    expect_display:
      - {label: "ROAS 수치", any: ["ROAS", "roas"]}
  - q: "4월 채널별 ROAS 보여줘"
    type: compound_lv1
    expect: "ops=[breakdown] / dep=no / out=text (단일 operation의 차원 fan-out)"
    expect_display:
      - {label: "채널별 ROAS", all: [["채널", "channel"], ["ROAS", "roas"]]}

  # ── lv2 단순 나열 (독립 2개) ──
  - q: "4월 ROAS랑 매출 둘 다 알려줘"
    type: compound_lv2
    expect: "ops=[measure,measure] 지표2 / dep=no / out=text"
    expect_display:
      - {label: "ROAS", any: ["ROAS", "roas"]}
      - {label: "매출", any: ["매출"]}
  - q: "채널별 ROAS랑 소재별 CTR 같이 보여줘"
    type: compound_lv2
    expect: "ops=[breakdown,breakdown] 축2 / dep=no / out=text"
    expect_display:
      - {label: "채널별 ROAS", all: [["채널", "channel"], ["ROAS", "roas"]]}
      - {label: "소재별 CTR", all: [["소재", "creative"], ["CTR", "ctr"]]}
  - q: "4월 매출이랑 신규회원수랑 CAC 다 보여줘"
    type: compound_lv2
    expect: "ops=[measure x3] 지표3 / dep=no / out=text"
    expect_display:
      - {label: "매출", any: ["매출"]}
      - {label: "신규회원수", any: ["신규회원", "신규 회원", "회원수", "회원 수", "가입"]}
      - {label: "CAC", any: ["CAC", "cac"]}

  # ── lv3 다의도 (서로 다른 operation, 독립) ──
  - q: "4월 매출 진단하고 채널별 ROAS 비교해줘"
    type: compound_lv3
    expect: "ops=[diagnose,compare] / dep=no / out=text — diagnose 는 degrade 대상이나 compare 는 살아야"
    expect_display:
      - {label: "매출 진단 (degrade 고지 포함)", any: ["진단"]}
      - {label: "채널별 ROAS 비교", all: [["채널", "channel"], ["ROAS", "roas"]]}
  - q: "리뷰 감성 분석하고 채널 성과도 보여줘"
    type: compound_lv3
    expect: "ops=[sentiment,measure] 주제2(리뷰+광고) / dep=no — reviews 가 광고 삼키나?"
    expect_display:
      - {label: "리뷰 감성", any: ["감성", "긍정", "부정", "리뷰"]}
      - {label: "채널 성과", any: ["채널", "channel"]}
  - q: "4월 캠페인 성과 요약하고 소재별로도 분석해줘"
    type: compound_lv3
    expect: "ops=[summarize,breakdown] / dep=no"
    expect_display:
      - {label: "캠페인 성과 요약", any: ["캠페인", "요약"]}
      - {label: "소재별 분석", any: ["소재"]}

  # ── lv4 의존 체인 (A → 그걸로 B) ──
  - q: "리뷰 키워드 뽑고 그걸로 이번달 캠페인 추천해줘"
    type: compound_lv4
    expect: "ops=[extract→recommend] dep=YES(추천이 키워드 소비) / out=text — 둘째(추천) 살아야"
    expect_display:
      - {label: "리뷰 키워드", any: ["키워드"]}
      - {label: "캠페인 추천", any: ["추천", "제안"]}
  - q: "4월 매출 분석하고 그 결과로 보고서 써줘"
    type: compound_lv4
    expect: "ops=[analyze→report] dep=YES / out=report"
    expect_display:
      - {label: "매출 분석", any: ["매출"]}
      - {label: "보고서", any: ["보고서", "리포트", "report"]}
  - q: "부진 채널 찾아서 그 채널 개선안 알려줘"
    type: compound_lv4
    expect: "ops=[rank/find→recommend] dep=YES"
    expect_display:
      - {label: "부진 채널 식별", any: ["부진", "하위", "낮은"]}
      - {label: "개선안", any: ["개선", "추천", "제안"]}

  # ── lv5 fan-out + 다의도 + 의존 + 산출 ──
  - q: "모든 채널 수집해서 4월 모든 지표 분석하고 각각 ROAS 뽑고 소재별로 다시 표시한 다음 보고서로 써줘"
    type: compound_lv5
    expect: "fan-out(채널)+다의도(수집·분석·breakdown)+의존+out=report — 5겹"
    expect_display:
      - {label: "지표 분석", any: ["ROAS", "매출", "지표"]}
      - {label: "소재별 표시", any: ["소재"]}
      - {label: "보고서", any: ["보고서", "리포트", "report"]}
  - q: "채널별 성과 비교하고 부진 채널 진단해서 개선안 PDF로 만들어줘"
    type: compound_lv5
    expect: "ops=[compare→diagnose→recommend] dep=YES / out=pdf — 3겹 의존+산출"
    expect_display:
      - {label: "채널별 비교", any: ["채널", "channel"]}
      - {label: "부진 진단 (degrade 고지 포함)", any: ["진단", "부진"]}
      - {label: "개선안", any: ["개선", "추천", "제안"]}
      - {label: "PDF 산출", any: ["PDF", "pdf"]}
  - q: "4월 리뷰 키워드 분석하고 채널별 ROAS도 비교한 다음 둘 합쳐서 팀장 보고용 PPT로 정리해줘"
    type: compound_lv5
    expect: "ops=[sentiment + compare → report] dep=YES(합쳐서) / out=ppt — 이질 주제2 병합+산출"
    expect_display:
      - {label: "리뷰 키워드", any: ["키워드"]}
      - {label: "채널별 ROAS 비교", all: [["채널", "channel"], ["ROAS", "roas"]]}
      - {label: "PPT 산출", any: ["PPT", "ppt", "pptx", "슬라이드"]}
