# stage-1 coverage 코퍼스 — "다양한 단일 쿼리 처리 가능한가" e2e 측정 (2026-06-10)
#
# 사용자 로드맵 stage 1 = 단일 쿼리 종류 breadth. 각 종류 1~2개, 독립(단일 의도).
# 복합/멀티(stage 2)·메모리(stage 3)는 제외. 종류별로 실제 답이 나오는지(degrade/empty 아닌지) 측정.
# 사용: python -m scripts.agent_lang_diagnostics.measure_stage1_coverage
#
# expect = 기대 동작. gap 표시 = 현재 미구현 추정(측정으로 확인).

client: clumi

queries:
  # ── 데이터 조회·분해·정렬·비교·추이 (metrics/comparison) ──
  - {q: "4월 매출 알려줘", kind: "조회(measure)", expect: "metric 값 답변"}
  - {q: "4월 채널별 ROAS 보여줘", kind: "분해(breakdown)", expect: "채널 분해 값"}
  - {q: "4월 매출 상위 채널 알려줘", kind: "상위N(rank)", expect: "top 채널"}
  - {q: "3월 대비 4월 매출 비교해줘", kind: "비교(compare)", expect: "MoM 비교"}
  - {q: "최근 3개월 매출 추이 보여줘", kind: "추이(trend)", expect: "시계열 추이"}

  # ── 분석 깊은층 (이번 세션 구현) ──
  - {q: "4월 매출이 왜 떨어졌는지 진단해줘", kind: "진단(diagnose)", expect: "diagnoser 원인"}
  - {q: "5월 매출 예측해줘", kind: "예측(forecast)", expect: "forecaster 예측"}
  - {q: "4월 실적 시사점 알려줘", kind: "추론(attribute)", expect: "insight_extractor 해석"}

  # ── 텍스트 (리뷰) ──
  - {q: "4월 리뷰 감성 분석해줘", kind: "리뷰감성(sentiment)", expect: "감성 분포"}

  # ── 질의응답 (이번 세션 구현) ──
  - {q: "ROAS가 뭐야?", kind: "질의응답-정의(qa)", expect: "개념 정의 답변"}
  - {q: "넌 뭐 할 수 있어?", kind: "질의응답-메타(qa)", expect: "능력 답변"}

  # ── 산출 (보고서/요약) ──
  - {q: "4월 매출 보고서 만들어줘", kind: "보고서(report)", expect: "report+pdf"}
  - {q: "4월 캠페인 성과 요약해줘", kind: "요약(summarize)", expect: "summary 텍스트"}

  # ── 의사결정/추천 (미구현 추정 — gap 후보) ──
  - {q: "부진 채널 개선안 추천해줘", kind: "추천(의사결정)", expect: "추천 — 미구현 추정(gap)"}
  - {q: "다음 달 광고 예산 어떻게 배분할까?", kind: "추천(의사결정)", expect: "추천 — 미구현 추정(gap)"}
