# 복합쿼리 토폴로지 스트레스 — task 수·병렬/직렬 혼합·tool 재사용 천장 측정 (2026-06-11)
#
# 사용자 질문: "몇 개 task? 뭐하고뭐하고+뭐분석뭐분석→결과? 병렬-직렬-병렬-병렬? 한 tool 중간 재등장?"
# 각 쿼리는 한 차원을 의도적으로 압박. probe_dag_topology.py 가 실제 DAG 모양을 덤프.

client: clumi

queries:
  # T1: task 수 + 병렬분석→병합(직렬). 4개 독립 분석 → 1 보고서
  - {q: "4월 매출 분석하고 ROAS 분석하고 리뷰 감성 분석하고 신규회원 분석해서 종합 보고서로 만들어줘", kind: "T1 다중분석→병합"}

  # T2: 병렬-직렬-병렬-직렬 혼합. 수집→[ROAS,CAC 병렬]→진단→추천→PDF
  - {q: "모든 채널 수집해서 채널별 ROAS랑 CAC 각각 뽑고 부진 채널 진단해서 개선안 PDF로 만들어줘", kind: "T2 혼합토폴로지"}

  # T3: tool 재사용 — 같은 지표(ROAS)를 두 차원(채널/소재)에서 → roas tool 2회 등장?
  - {q: "채널별 ROAS랑 소재별 ROAS 둘 다 보여주고 둘을 비교해줘", kind: "T3 tool재사용"}

  # T4: 깊은 직렬 체인 — 측정→비교→예측→추천 (A→B→C→D)
  - {q: "4월 매출 보고 3월 대비 비교하고 그 추세로 5월 예측해서 예산 어떻게 쓸지 추천해줘", kind: "T4 깊은직렬"}

  # T5: 와이드 fan-out — 6개 지표 병렬
  - {q: "4월 매출, ROAS, CAC, 전환율, 객단가, 재구매율 전부 보여줘", kind: "T5 와이드병렬"}
