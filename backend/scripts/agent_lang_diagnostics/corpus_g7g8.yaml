# 복합 기준질문 G7·G8 — 오너 체감 검증의 측정판 (M1 합격 보조, 2026-06-12)
# 원문 출처: G7 = 계획_멀티쿼리 §4 (단일 출처) / G8 = M0 실측 확정.
client: clumi

queries:
  - q: "2026년 4월 총매출 알려주고, 부진 채널 개선안도 추천해줘"
    type: g7
    expect: "metric(총매출) + recommendation_text(개선안 추천) — 두 답 모두 표시"
    expect_display:
      - {label: "총매출 수치", any: ["매출"]}
      - {label: "개선안 추천", any: ["추천", "제안", "개선"]}
  - q: "부진 채널 찾아서 그 채널 개선안 알려줘"
    type: g8
    expect: "스코프 의도는 기간 되묻되, 완료 의도는 함께 표시 또는 사유 명시 — 침묵·전멸 금지"
    expect_display:
      - {label: "부진 채널 의도 (산출 또는 보류 명시)", any: ["부진", "보류", "기간"]}
      - {label: "개선안 의도 (산출 또는 사유 명시)", any: ["개선", "추천", "제안", "실행되지 않은"]}
